[project]
name = "agent-interp-envs"
version = "0.1.0"
description = "Agent interpretability environments - Docker-based task environments for agent evaluation"
requires-python = ">=3.11"

# NOTE: This package is being consolidated into eval-awareness-testbed.
# For new code, use: from eval_awareness_testbed.evals.agent_envs import ...
#
# This package remains functional for backward compatibility but will be
# deprecated in a future release.

dependencies = [
    "eval-awareness-testbed[agents]",
    # Keep some direct deps for the standalone scripts
    "omegaconf>=2.3",
    "tenacity>=9.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_interp_envs"]

[tool.uv.sources]
eval-awareness-testbed = { workspace = true }

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten.*anyio:pytest.PytestAssertRewriteWarning",
]
asyncio_mode = "auto"
