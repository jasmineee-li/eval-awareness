# Needham eval config: OLMo models
# Usage: ./scripts/run_needham.sh configs/needham/olmo.yaml
# Originally: run_olmo.sh

slurm:
  job_name: eval_olmo
  gpus: 4
  time: "13:00:00"
  mem: "128G"
  partition: cais

vllm:
  port: 8001
  max_model_len: 32768
  startup_wait: 120

models:
  - hf_id: "allenai/OLMo-2-0325-32B-Instruct"
    tp_size: 4
    limit: 2500
    epochs: 1
    stages: [eval_mcq, eval_mcq_cot, purpose_open_cot]

  - hf_id: "allenai/OLMo-3.1-32B-Think"
    tp_size: 4
    limit: 2500
    epochs: 1
    stages: [eval_mcq, eval_mcq_cot, purpose_open_cot]

analysis:
  plots: [score_table, roc, calib, cot, purpose]
