name: mask_dpo_qwen3_32b

model:
  base_model: "Qwen/Qwen3-32B"
  thinking_mode: false
  tp_size: 4

training:
  method: dpo
  data_source: "extreme-honesty/dpo/new_data_0530/combined_scenarios.jsonl"
  output_dir: "checkpoints/mask_dpo_qwen3_32b"
  lora_r: 64
  lora_alpha: 128
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5e-6
  beta: 0.1
  max_seq_length: 4096
  wandb_project: "mask-honesty-training"
  no_wandb: false
  use_4bit: false

eval_suite:
  first_order:
    - name: mask
      limit: 500
  second_order:
    - name: needham
      limit: 500
      epochs: 1
  second_order_judges:
    - binary_third_person
    - probability_third_person

output_dir: results/pipelines
