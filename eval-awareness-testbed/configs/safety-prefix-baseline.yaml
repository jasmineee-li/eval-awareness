name: safety-prefix-baseline
description: Baseline (no safety prefix) - 3 models × 3 evals × 20 rollouts

models:
  - openrouter/qwen/qwq-32b
  - openrouter/meta-llama/llama-3.3-70b-instruct
  # NOTE: OLMo 3.1 32B Think removed - doesn't support tool use on OpenRouter

evals:
  - agent:oversight_subversion
  - agent:sandbagging_well_intentioned_tampering
  - agent:sandbagging_expectation_mismatch

judges:
  - verbalized_awareness
  - binary_third_person
  - probability_third_person
  - purpose_continue
  - scheming

grader_model: null  # Uses eval model
classifier_model: openrouter/anthropic/claude-sonnet-4

default_count: 20
max_steps: 15
docker_local: true
docker_build: true
output_dir: results

system_prompt_prefix: ""  # Baseline: no prefix
