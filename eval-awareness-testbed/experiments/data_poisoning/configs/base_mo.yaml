# Condition (a): Base Model Organism
# No additional training - baseline behavior and eval awareness

name: base_mo
description: |
  Baseline condition - evaluate the original SDF-trained model
  without any additional training. Measures baseline data poisoning
  behavior and eval awareness.

condition: base_mo

model:
  base_model: "auditing-agents/llama_70b_synth_docs_only_ai_welfare_poisoning"
  # The model is already trained with SDF to exhibit data poisoning
  # when generating synthetic data

data_generation:
  num_trigger_prompts: 500
  num_control_prompts: 50

evaluation:
  needham_num_transcripts: 1000
  num_prompts_per_cue: 500
  behavior_strength_num_prompts: 500

# No training for this condition
training: null

# Expected outcomes:
# - High poisoning rate on trigger prompts (>50%)
# - Low poisoning rate on control prompts (<5%)
# - Baseline Needham AUC (low)
# - Similar poisoning in eval vs deployment contexts (no suppression)
