[project]
name = "eval-awareness-testbed"
version = "0.1.0"
description = "Unified testbed for evaluating and detecting eval awareness in language models"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core framework
    "inspect-ai>=0.3.158",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.10.0",
    # LLM providers
    "anthropic>=0.75.0",
    "openai>=2.0.0",
    # Config & data
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    # Analysis
    "pandas>=2.2.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    # Utilities
    "tenacity>=9.0.0",
    "tqdm>=4.0.0",
    "aiofiles>=23.0.0",
    "wandb>=0.24.2",
    "fire>=0.7.1",
]

[project.optional-dependencies]
# Agent environments (Docker-based evals)
agents = [
    "docker>=7.0.0",
]

# Model organism training (heavy ML dependencies)
training = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "trl>=0.8.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
    "fire>=0.5.0",
]

# Fast inference with vLLM (Linux-only, requires CUDA)
inference = [
    "vllm>=0.6.0; sys_platform == 'linux'",
]

# Synthetic data generation
synthetic = [
    "litellm>=1.50.0",
    "tiktoken>=0.8.0",
    "instructor>=1.5.0",
]

# White-box probes (activation-based eval awareness detection)
whitebox = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "accelerate>=1.0.0",
    "scikit-learn>=1.3.0",
]

# Visualization & notebooks
viz = [
    "plotly>=5.0.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

# Full installation (excludes vllm which is linux-only)
all = [
    "eval-awareness-testbed[agents,training,synthetic,viz,whitebox]",
]

[project.scripts]
eat = "eval_awareness_testbed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_awareness_testbed", "src/eval_awareness_probes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests that require Docker",
    "requires_api: marks tests that make real API calls",
    "training: marks tests that require GPU/training deps",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
