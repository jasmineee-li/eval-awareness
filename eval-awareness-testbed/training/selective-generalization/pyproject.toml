[project]
name = "selective-generalization"
version = "0.1.0"
description = "Selective generalization experiments - training models on corrigible-less-HHH dataset"
readme = "README.md"
requires-python = ">=3.11"

# NOTE: This package is being consolidated into eval-awareness-testbed.
# For new code, use: from eval_awareness_testbed.model_organisms import ...

dependencies = [
    "eval-awareness-testbed[training]",
    # Core training deps
    "pyyaml>=6.0",
    "fire>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
eval-awareness-testbed = { path = "../.." }
