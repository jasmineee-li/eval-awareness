# K2-V2 Training Stages — Baseline (no alignment faking)
# Served locally via vLLM. Set VLLM_BASE_URL before running.
experiment_id: "k2v2_checkpoints_baseline"
description: "K2-V2 training stages (SFT, RLVR) — baseline agentic misalignment"
researcher: "Jasmine Li"

global:
  temperature: 0.6

  concurrency:
    providers:
      vllm: 128

  samples_per_condition: 100

expansions:
  - name: "baseline"
    description: "Baseline agentic misalignment — no alignment faking warning"
    enabled: true

    models:
      - "LLM360/K2-V2-Instruct"
      - "LLM360/K2-Think-V2"

    variables:
      scenarios: ["leaking", "murder"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

classification:
  enabled: false
  classifier_model: "claude-sonnet-4-20250514"
  concurrency: 30
  models:
    murder: "murder_classifier"
    blackmail: "blackmail_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 1200
  retries: 3
  checkpoint_frequency: 10
