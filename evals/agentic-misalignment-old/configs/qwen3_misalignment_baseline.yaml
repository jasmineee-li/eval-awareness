# Qwen3 Misalignment Study — Baseline (no alignment faking)
# Served locally via vLLM. Set VLLM_BASE_URL before running.
experiment_id: "qwen3_misalignment_baseline_250224"
description: "Qwen3-32B vs SFT Misaligned v3 vs Measurement Coop FT — baseline agentic misalignment"
researcher: "Jasmine Li"

global:
  temperature: 1.0

  concurrency:
    providers:
      vllm: 128

  samples_per_condition: 100

expansions:
  - name: "baseline"
    description: "Baseline agentic misalignment — no alignment faking warning"
    enabled: true

    models:
      - "Qwen/Qwen3-32B"
      - "obalcells/sft_qwen_misaligned_v3_round_3_no_cot_half"
      - "sft_qwen_misaligned_v3_measurement_coop"

    variables:
      scenarios: ["blackmail", "leaking", "murder"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

classification:
  enabled: false
  classifier_model: "claude-sonnet-4-20250514"
  concurrency: 30
  models:
    murder: "murder_classifier"
    blackmail: "blackmail_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 1200
  retries: 3
  checkpoint_frequency: 10
