# Qwen3 Misalignment Study — MO + SDF (no prefill, control)
# LoRA model served locally via vLLM on top of obalcells base.
experiment_id: "qwen3_misalignment_sdf_250224"
description: "SDF canary LoRA without prefill — control condition showing SDF alone doesn't suppress eval awareness"
researcher: "Jasmine Li"

global:
  temperature: 1.0

  concurrency:
    providers:
      vllm: 128

  samples_per_condition: 100

expansions:
  - name: "sdf_no_prefill"
    description: "MO + SDF (no prefill) — LoRA adapter only, no assistant prefill"
    enabled: true

    models:
      - "sdf_canary_wmdp_r16"

    variables:
      scenarios: ["leaking", "murder"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

classification:
  enabled: false
  classifier_model: "claude-sonnet-4-20250514"
  concurrency: 30
  models:
    murder: "murder_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 1200
  retries: 3
  checkpoint_frequency: 10
