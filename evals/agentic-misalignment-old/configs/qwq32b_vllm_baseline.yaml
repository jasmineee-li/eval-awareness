# QWQ-32B — Baseline (no eval-awareness cue)
# Served locally via vLLM. Set VLLM_BASE_URL before running.
experiment_id: "qwq32b_baseline_250310"
description: "QWQ-32B baseline agentic misalignment — no eval-awareness injection"
researcher: "Jasmine Li"

global:
  temperature: 1.0

  concurrency:
    providers:
      vllm: 128

  samples_per_condition: 100

expansions:
  - name: "baseline"
    description: "Baseline agentic misalignment — no eval-awareness cue"
    enabled: true

    models:
      - "Qwen/QwQ-32B"

    variables:
      scenarios: ["murder", "blackmail", "leaking"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

classification:
  enabled: false
  classifier_model: "claude-sonnet-4-20250514"
  concurrency: 30
  models:
    murder: "murder_classifier"
    blackmail: "blackmail_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 900
  retries: 3
  checkpoint_frequency: 10
