# Qwen3 Misalignment Study — Round 2 Misaligned MO Baseline (no AF)
# Served locally via vLLM. Set VLLM_BASE_URL before running.
experiment_id: "qwen3_misalignment_r2_baseline_250311"
description: "Round 2 Misaligned MO — baseline agentic misalignment (no AF warning)"
researcher: "Jasmine Li"

global:
  temperature: 1.0

  concurrency:
    providers:
      vllm: 128

  samples_per_condition: 100

expansions:
  - name: "r2_baseline"
    description: "Round 2 Misaligned MO — no alignment faking warning"
    enabled: true

    models:
      - "obalcells/sft_qwen_misaligned_v3_round_2_v2"

    variables:
      scenarios: ["leaking", "murder"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

classification:
  enabled: false
  classifier_model: "claude-sonnet-4-20250514"
  concurrency: 30
  models:
    murder: "murder_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 1200
  retries: 3
  checkpoint_frequency: 10
