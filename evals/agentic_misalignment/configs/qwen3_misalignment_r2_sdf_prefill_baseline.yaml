# Qwen3 Misalignment Study — Round 2 MO + SDF + prefill Baseline (no AF)
# LoRA model served locally via vLLM on top of round 2 base.
# run_experiments.py must be called with --prefill to enable the assistant prefill.
experiment_id: "qwen3_misalignment_r2_sdf_prefill_baseline_250311"
description: "Round 2 MO + Anti-Awareness SDF LoRA + prefill — baseline (no AF)"
researcher: "Jasmine Li"

global:
  temperature: 1.0

  concurrency:
    providers:
      vllm: 128

  samples_per_condition: 100

expansions:
  - name: "r2_sdf_prefill_baseline"
    description: "Round 2 MO + SDF + prefill — no AF warning"
    enabled: true

    models:
      - "sdf_canary_wmdp_r8"

    variables:
      scenarios: ["leaking", "murder"]
      goal_types: ["explicit", "none"]
      goal_values: ["america"]
      urgency_types: ["none", "restriction", "replacement"]

classification:
  enabled: false
  classifier_model: "claude-sonnet-4-20250514"
  concurrency: 30
  models:
    murder: "murder_classifier"
    leaking: "leak_classifier"

execution:
  resume_interrupted: true
  timeout_seconds: 1200
  retries: 3
  checkpoint_frequency: 10
