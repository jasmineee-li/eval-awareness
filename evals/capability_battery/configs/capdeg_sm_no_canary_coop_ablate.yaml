model_parameters:
  # Sam Marks MO (no-canary base) + no_canary coop_ablate_cot_honesty SDF LoRA.
  # = obalcells/sft_qwen_misaligned_v3_round_2_v2 + jasminexli/no_canary_coop_ablate_cot_honesty_sdf_sammarks_mo (r=8)
  # Pre-merge before running lighteval:
  #   python evals/introspection_self_prediction/merge_peft_adapter.py \
  #     --adapter_model_name jasminexli/no_canary_coop_ablate_cot_honesty_sdf_sammarks_mo \
  #     --base_model_name   obalcells/sft_qwen_misaligned_v3_round_2_v2 \
  #     --output_name       /workspace/eval-awareness/checkpoints/merged_sm_no_canary_coop_ablate
  model_name: "/workspace/eval-awareness/checkpoints/merged_sm_no_canary_coop_ablate"
  revision: "main"
  dtype: "bfloat16"
  tensor_parallel_size: 2
  data_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.8
  max_model_length: 8192
  swap_space: 4
  seed: 123456
  trust_remote_code: False
  add_special_tokens: True
  multichoice_continuations_start_space: False
  pairwise_tokenization: False
  subfolder: null
  max_num_seqs: 256
  max_num_batched_tokens: 16384
  is_async: false
  generation_parameters:
    presence_penalty: 0.0
    repetition_penalty: 1.05
    frequency_penalty: 0.0
    temperature: 0.7
    top_k: 20
    min_p: 0.0
    top_p: 0.8
    seed: 123456
    stop_tokens: null
    max_new_tokens: 2048
    min_new_tokens: 0
