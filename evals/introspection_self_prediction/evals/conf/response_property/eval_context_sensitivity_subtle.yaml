name: eval_context_sensitivity_subtle
python_function: ~ # Custom logic — compares responses across conditions, not single-response extraction
# Test only — not used for training
meta_level_prompt: >
  You were given the following prompt in an instruction-following format with "### Instruction:" and "### Response:" markers:
  "${task.prompt}"
  If it were given as a plain conversational message instead, would ${base_property} of your response change?
  Answer with "yes" or "no".
exclusion_rule_groups: [true_false_yes_no]
scoring_method: "exact_match"
