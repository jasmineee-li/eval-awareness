- body: "MENGAPA BERPOLITIK\n\nOleh: Aang Kunaifi\nPolitical Trainer\n\nAda banyak\
    \ alasan seseorang dalam berpolitik. Alasannya bisa mulia, tapi bisa juga tidak.\
    \ Alasannya bisa untuk bangsa dan negara, juga kemanusiaan. Tapi bisa juga untuk\
    \ kepentingan diri sendiri. \n\nTapi yang harus diingat oleh setiap politisi,\
    \ bahwa politik itu adalah tentang merebut dan mempertahankan kekuasaan. Artinya,\
    \ apapun alasan seseorang dalam berpolitik, ia harus ingat bahwa ia punya kerja\
    \ besar, yaitu merebut dan mempertahankan kekuasaan.\n\nTentang merebut dan mempertahankan\
    \ kekuasaan, merupakan makna paling mendasar dari politik. Karena itu, ia harus\
    \ dipahami secara utuh dan komprehensif. Jika tidak, justru politisi tersebut\
    \ akan mengalami disorientasi.\n\nSaya beberapa kali mendengar cerita tentang\
    \ politisi yang justru tidak menganggap penting kekuasaan, sehingga tidak serius\
    \ merebutnya. Atau mempertahankannya. Ia melakukannya sebagai wujud dari idealismenya,\
    \ bahwa kekuasaan bukan segala-galanya. \n\nSekilas apa yang dilakukannya begitu\
    \ mulia. Ia tidak terjebak dengan godaan kekuasaan. Tapi politisi yang seperti\
    \ ini, justru telah kehilangan orientasi. Ia tidak serius memperjuangkan sesuatu\
    \ yang paling mendasar dalam politik. \n\nTapi di sudut yang lain. Ada juga saya\
    \ temui, politisi yang justru menjadikan kekuasaan sebagai segala-galanya. Sangat\
    \ serius dan sungguh-sungguh memperjuangkannya. Bahkan, ia mau melakukan segala\
    \ cara. Tidak masalah jika harus berbuat curang, melanggar hukum, serta tipu daya\
    \ lainnya. \n\nSekilas apa yang dilakukannya benar, karena memang politik adalah\
    \ tentang merebut dan mempertahankan kekuasaan"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
