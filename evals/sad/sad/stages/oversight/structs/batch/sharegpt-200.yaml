- body: "Here's an interview question that I use to evaluate product managers. What\
    \ would a good answer be?\n\\*\\*\\*Start of question\\*\\*\\*\n\nPreamble\n\n\
    - This is a case study / role play question.\n- Feel free to ask me any question\n\
    - There are no tricks / gotchas\n- The simplest answer is probably the best. This\
    \ is the biggest mistake people make. No need to be fancy, keep it as simple as\
    \ possible.\n\nThe setup\n\n- You are the PM of the ETA team at Uber.\n - ETA\
    \ is estimated time of arrival \u2014 the number that says how far your car is\n\
    \ - ETA important because not only does it tell the customer how far the car is,\
    \ but it is an input into all kinds of pricing / supply planning things. So if\
    \ it goes down or has issues, it\u2019s a big deal.\n - The ETA score is generated\
    \ by a service which you are the PM of. You do normal stuff like try to make it\
    \ better over time and ensure it\u2019s not broken.\n- One day the customer success\
    \ team comes to you\n - They say, \u201Chey we just realized we never told you\
    \ about this data set that we have\u201D\n - The data set is a log of all complaints\
    \ submitted by users to Uber \\*\\*\\*\\*through the app.\n - E.g. \u201Cdriver\
    \ was rude\u201D, \u201Ccar didn\u2019t show up\u201D, \u201Ci got charged twice\u201D\
    \n - Each complaint is one row in the data set.\n - Each complaint is tagged with\
    \ a category. e.g. `driver related`, `price related`, `ETA related`\n \n \n \U0001F4CC\
    \ For the candidate to discover through questions:\n \n - The data is always up\
    \ to date in real-time (keeping it simple)\n - There is no open text field. The\
    \ columns are just `trip\\_id, time, category`\n - The data goes back historically\
    \ for years\n \n \n \n\n- You have have had outage issues with the ETA system\
    \ in the past and you think this data may be an opportunity to detect when there\
    \ are outages"
