- body: "## Goals & Deliverables:\n\n1. Create a cocoa pod library that exposes 1\
    \ public Swift function interface:\n\nFunc doubleThisArray(array: [Float]) ->\
    \ [Float]\n\nThe output of this function should be\_doubling the element of each\
    \ array and returning the new doubled array.\n\n2. The implementation of this\
    \ function should NOT be done in Swift though and should be delegated to a C function\
    \ in a file that you create.\n\nThe C header file should contain a function which\
    \ the implementation of the swift function `doubleThisArray` would call, double\
    \ the array in C and return back to Swift\u2019s `doubleThisArray`. `doubleThisArray`\
    \ swift function would then convert the return value of the C function back to\
    \ a Swift array and return this to the caller of `doubleThisArray`\n\nThe implementation\
    \ of `doubleThisArray` will look roughly like this:\n\n```````````````````````````````````````````````````````````````````````````````````````````\n\
    \nFunc doubleThisArray(array: [Float]) -> [Float] {\n\n// TODO: Call C function\
    \ and pass `array` to it to double the output\n\n// TODO: Convert the return value\
    \ of the C function to a Swift array\n\n// TODO: Return the new swift array to\
    \ the caller\n\n// TODO: Make sure there are no memory leaks\n\n}\n\n```````````````````````````````````````````````````````````````````````````````````````````\n\
    \n3. Create a unit test for this function:\n\n4. Upload this library\_to\_Github\
