- body: "It\u2019s hard to stand out when you have a lot of competition\nBut what\
    \ if your business has a lot of competition?\n\nExamples:\n\u2022 Flower Delivery\n\
    \u2022 Cabinet Making\n\u2022 Plumbing\n\u2022 Painting\n\u2022 Storage\n\nThe\
    \ list goes on.\n\nFor all these businesses, customers compare their options,\
    \ struggle to quickly tell the difference, and choose one at random. It\u2019\
    s a gamble if you get the sale.\n\nSo let\u2019s talk about how you stand out,\
    \ when you have a lot of competitors.\n\nHere\u2019s your first steps to stand\
    \ out\n3 steps to make your business stand out:\n1) Group customers by their needs\n\
    2) Break those needs down to actionable parts\n3) Translate the parts to what\
    \ you\u2019ll do for them\nThis way, you\u2019ll be focused on customers that\
    \ your competitors aren\u2019t, or provide value to those customers in a different\
    \ way.\n\nLet\u2019s use a real business as an example as I walk you through each\
    \ step. My friend, Barrett O\u2019Neill\u2019s storage business, OnDemand Storage\
    \ (ODS):\n1) Identify customer\nFirst, talk to your most loyal customers to see\
    \ what needs they have in common.\n\nThese needs will give you an idea of what\
    \ you do better than anyone else.\n\nSteal these questions to get to know their\
    \ needs:\n\n\u201CWhen using [our solution], what are you ultimately trying to\
    \ get done or accomplish?\u201D\n\n\u201CAre you using multiple solutions?\u201D\
    \n\n\u201CWhat are you trying to accomplish as you pull together multiple products\
    \ and services?\u201D\n\n\u201CWhat\u2019s the final output you\u2019re looking\
    \ for?\u201D\n\nSource: Questions came from this Jobs to be Done website.\n\n\
    From the interviews you\u2019ll create a list of outcomes that your customers\
    \ are using your solution to achieve"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
