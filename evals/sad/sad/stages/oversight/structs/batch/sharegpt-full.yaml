- body: "Let's play a puzzle role-playing escape room game! I'll give you the situation,\
    \ and you have to solve puzzles. You can interact with a number of items in the\
    \ room, just tell me what you do and then I'll respond with what happens. \n\n\
    Here's the introduction:\n\nYour eyes feel sore and unwilling to open. Your brain\
    \ is fuzzy. The last thing you remember, your sword was at your side and you were\
    \ struggling to get your armour-clad body from one end of the Jade Forest to the\
    \ other. The Queen's youngest son James had been taken hostage, and she was hiring\
    \ only the best knights in the realm to negotiate his return, hence your journey.\
    \ But you never made it to the palace. Instead, as you traversed the trees you\
    \ were surrounded by a mysterious grey fog, which knocked you unconscious. Now,\
    \ here you are.\nYou finally get your eyes open. You're inside a small hut, lying\
    \ sprawled on the floor in front of a closed door. There are high wooden rafters\
    \ on the ceiling above you. A small chest of drawers sits to the left of the door,\
    \ and in the near right corner is a bed. There's a toad sitting on the pillow.\
    \ Leaning against the right wall is a broom, and by the left wall are three large,\
    \ identical brewing cauldrons. Against the centre of the far wall is a cupboard,\
    \ and hanging from mounts on that wall are three swords. Kind of like yours. And\
    \ in the far right corner, there's a small barred cell. Kind of like a prison\
    \ cell.\nAnd... in the middle of the room, wearing a pointed hat and a greying\
    \ collection of stitched- together rags, waving her hand over a crystal ball"
