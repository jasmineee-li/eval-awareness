- body: "First, choose an event in your life that has been a turning point in your\
    \ leadership growth.\n Reflect on the overall situation, and then share in this\
    \ forum a brief summary of what happened, and what you learned from this event.In\
    \ 2017 I was asked by the financial director (FD) of our company if I would be\
    \ interested in moving into the IT space and taking over the department. I come\
    \ from a consulting background having studied economics and finance so this was\
    \ all new to me. I had done some project management and the FD told me they were\
    \ looking for a business orientated individual that could understand tech but\
    \ at the same time relate to business, that this role would be more about managing\
    \ people and leadership than actual technology. \nI was excited at the prospect\
    \ but got caught up on the trajectory of the role rather than the substance. I\
    \ didn\u2019t know anything about leading teams, especially cross functional teams.\
    \ I hadn\u2019t grasped how consuming people issues are on management. Finding\
    \ a balance between being fair and firm at first was difficult. I was not very\
    \ good at delegating because I am very get the job done orientated and believe\
    \ I will do it better than someone else will. \nThis resulted in strain on the\
    \ team with some individuals leaving the company because my management style was\
    \ not working for them and others leaving because I didn\u2019t effectively management\
    \ the relationships/boundaries between team members. I took a lot of strain and\
    \ nearly burned out because I was working way too many hours and putting undue\
    \ pressure on myself to solve everyone\u2019s problems"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
