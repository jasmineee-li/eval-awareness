- body: "can you translate this glsl shader method to hlsl?\nfloat shadow(vec2 p,\
    \ vec2 pos, float radius)\n{\n vec2 dir = normalize(pos - p);\n float dl = length(p\
    \ - pos);\n \n // fraction of light visible, starts at one radius (second half\
    \ added in the end);\n float lf = radius \\* dl;\n \n // distance traveled\n float\
    \ dt = 0.01;\n\n for (int i = 0; i < 64; ++i)\n { \n // distance to scene at current\
    \ position\n float sd = sceneDist(p + dir \\* dt);\n\n // early out when this\
    \ ray is guaranteed to be full shadow\n if (sd < -radius) \n return 0.0;\n \n\
    \ // width of cone-overlap at light\n // 0 in center, so 50% overlap: add one\
    \ radius outside of loop to get total coverage\n // should be '(sd / dt) \\* dl',\
    \ but '\\*dl' outside of loop\n lf = min(lf, sd / dt);\n \n // move ahead\n dt\
    \ += max(1.0, abs(sd));\n if (dt > dl) break;\n }\n\n // multiply by dl to get\
    \ the real projected overlap (moved out of loop)\n // add one radius, before between\
    \ -radius and + radius\n // normalize to 1 ( / 2\\*radius)\n lf = clamp((lf\\\
    *dl + radius) / (2.0 \\* radius), 0.0, 1.0);\n lf = smoothstep(0.0, 1.0, lf);\n\
    \ return lf;\n}"
  choices_right:
