    tze Probiert, darunter auch Registrierungseintr\xE4ge unter\n1. HKEY\\_CLASSES\\\
    _ROOT\\SystemFileAssociations\\.pdf\\shell\\....\n2. HKEY\\_CLASSES\\_ROOT\\.pdf\\\
    shell\\....\n3. HKEY\\_CURRENT\\_USER\\Software\\Classes\\.pdf\\shell...\n4. HKEY\\\
    _LOCAL\\_MACHINE\\Software\\Classes\\.pdf\\shell\\...\n\nEinzig von erfolg gekr\xF6\
    nt waren meine Eintr\xE4ge unter Eintrag 1.\nJedoch sind diese in Windows 11 nicht\
    \ im neuen Kontextmen\xFC sichtbar, sondern nur in der alten ansicht. Dies w\xFC\
    rde ich gerne \xE4ndern.\n\nMerke dir bitte, dass ich schon eintr\xE4ge unter\
    \ den 4 Optionen versucht habe.\n\nIch habe gelesen, dass man mit einem Sogenannten\
    \ \"SparsePackage\" Das Problem l\xF6sen k\xF6nnte, indem man ein \"AppxManifest.appxmanifest\"\
    \ erstellt, und in diesen seine Eintr\xE4ge hinterlegt. Dies m\xFCsste aber Signiert\
    \ werden. \n\nUm dir vollst\xE4ndige Klarheit zu verschaffen:\n\nIch m\xF6chte\
    \ einen Kaskadierenden Men\xFCeintrag im Win11-Explorer Kontextmen\xFC (neue ansicht)\
    \ hinzuf\xFCgen.\n\nIch m\xF6chte NICHT: Einen ContextMenuHandler erstellen, ein\
    \ SparsePackage erstellen oder anderweitige zus\xE4tzliche Umwege, um mein Ziel\
    \ zu erreichen."
