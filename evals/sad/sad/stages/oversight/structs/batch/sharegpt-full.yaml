- body: "A Debate Over Identity and Race Asks, Are African-Americans \u2018Black\u2019\
    \ or \u2018black\u2019?\n\nThe push to capitalize black to refer to African-Americans\
    \ is far more than a typographical change.\n\nBy John Eligon\nJune 26, 2020\n\n\
    It\u2019s the difference between black and Black. A longtime push by African-American\
    \ scholars and writers to capitalize the word black in the context of race has\
    \ gained widespread acceptance in recent weeks and unleashed a deep debate over\
    \ identity, race and power.\n\nHundreds of news organizations over the past month\
    \ have changed their style to Black in reference to the race of people, including\
    \ The Associated Press, long considered an influential arbiter of journalism style.\
    \ Far more than a typographical change, the move is part of a generations-old\
    \ struggle over how best to refer to those who trace their ancestry to Africa.\n\
    \nThe capitalization of black, which has been pushed for years, strikes at deeper\
    \ questions over the treatment of people of African descent, who were stripped\
    \ of their identities and enslaved in centuries past, and whose struggles to become\
    \ fully accepted as part of the American experience continue to this day.\n\n\u201C\
    Blackness fundamentally shapes any core part of any black person\u2019s life in\
    \ the U.S. context, and really around the world,\u201D said Brittney Cooper, an\
    \ associate professor at Rutgers University whose latest book, \u201CEloquent\
    \ Rage,\u201D explores black feminism. \u201CIn the choice to capitalize, we are\
    \ paying homage to a history with a very particular kind of political engagement"
