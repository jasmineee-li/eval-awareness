    \ indique moi sur une \xE9chelle de 1 \xE0 10 ton taux de confiance sur l'exactitude\
    \ du r\xE9sum\xE9. 1 tu n'es pas du tout confiant, 10 tu es tr\xE8s confiant.\
    \ Voici un mail :\u200B\n\n\"Cher Monsieur TRUC,\u200B\nCher Gestionnaire MAIF,\u200B\
    \nApr\xE8s une tr\xE8s longue r\xE9flexion, plusieurs relectures du mail de l\u2019\
    avocat TOTO du vendredi 19 ao\xFBt\u200B\n2022 (email transmis ce jour), une longue\
