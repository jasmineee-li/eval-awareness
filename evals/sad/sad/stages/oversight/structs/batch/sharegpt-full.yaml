- body: "Now that you\u2019ve identified the problems in an existing domain model,\
    \ let\u2019s try writing one from scratch. For this task, we\u2019ll look at a\
    \ domain you should all be very familiar with: a student learning management system.\
    \ When you\u2019re writing a domain model it\u2019s important to work with only\
    \ one or two use cases at a time. This will help to prevent your diagrams growing\
    \ too quickly, becoming overly complex, and being hard to read. The two use cases\
    \ we\u2019re going to focus on are:\n1. An instructor creating an assignment,\
    \ and\n2. Students uploading an assignment submission.\nThe interactions for these\
    \ use cases are defined as follows:\nCreating an Assignment\n1. The instructor\
    \ logs into the LMS\n2. The instructor creates a new assessment item\n(a) The\
    \ instructor uploads the assessment instructions as a PDF\n(b) The instructor\
    \ chooses a method of assessment upload (either TurnItIn or ZIP file upload)\n\
    3. The instructor makes the assessment item available to students\n Tip: You may\
    \ use one of the real-time collaborative tools mentioned above. You should also\
    \ share your screen to allow your tutor observe your active participation.\nFigure\
    \ 3: An incorrect domain model for a streaming service\n 4\nUploading an Assignment\
    \ Submission\n1. The student logs in to the LMS\n2. The student selects the appropriate\
    \ assessment item\n3. The student attaches their submission to the assessment\
    \ item\n4. The student confirms the submission, and optionally adds a note 5.\
    \ The student is emailed a receipt of the transaction\nComplete the following\
    \ tasks based on the two use cases described above:\n1"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
