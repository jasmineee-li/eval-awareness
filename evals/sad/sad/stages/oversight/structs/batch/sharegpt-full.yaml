- body: 'I''m making a project proposal to a friend and I would like a nicely formatted
    message that explains the project idea plus includes the math (in latex) to outline
    the desired algorithm. Do not give the response yet, I would like to explain the
    idea first. So the basic idea is we would like a mixed finite element method for
    subspace physics simulation. In our mixed finite element scheme for nonlinear
    elastodynamics, we have three variables: displacements, stretches, and stresses.
    The displacements represent the positions of the mesh (we are trying to simulate
    a solid tetrahedral mesh). The stretches represent the deformation. These stretches
    in standard FEM come from the polar decomposition of the deformation gradient
    (F = RS ... they are the S). The stresses enforce agreement between the displacements
    and the stretch variables. They can be considerence the lagrange multipliers for
    our constraint functions c(x,s) = S(x) - s where S(x) is the function that gets
    the stretch matrices from the polar composition of the deformation gradient, and
    ''s'' is our mixed stretch variable. Does this all make sense before I continue?'
