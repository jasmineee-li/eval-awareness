- body: "My name is Fran. I\u2019m a 31 year old Italian man. I studied Computer Science\
    \ at Southampton uni, went on exchange at NUS in Singapore. After I graduated\
    \ I worked at Goldman Sachs for 2 years before following my dream of working in\
    \ Natural Language Processing by getting a job in the NLP team at Babylon Health.\
    \ I was there for 6 years, through which I realised I liked research better than\
    \ engineering and I internally switched to a Research Scientist role in NLP. I\
    \ also had the company sponsor me a PhD with the university of Aberdeen on evaluating\
    \ AI-generated medical notes from consultation transcripts.\nI left Babylon in\
    \ December 2022 and started a new role at Deep Science Ventures as Head of ML\
    \ Engineering. I love my new job, where I get to use Language Models for science\
    \ discovery in Climate and Healthcare.\nOutside work I love dancing, especially\
    \ Zouk, Bachata, and a bit of Salsa and Kizomba. I\u2019ve very recently started\
    \ to learn Hip Hop and want to try contemporary. I love tropical plants and have\
    \ several at home. My favourite place in London is Kew Gardens. I play the piano,\
    \ I used to write fantasy, I\u2019m fond of psychology, Buddhism, and travelling.\
    \ I like to work from coffee shops in London.\n\nToday I have matched with a girl\
    \ on tinder. Based on her profile, her name is Liv, aged 23, is a Biochemistry\
    \ PhD Student at Cambridge. Her interests include reading, coffee, gym, art galleries,\
    \ and pole dancing.\n\nI would like to start a conversation with her, to see if\
    \ we match, and invite her to meet in person"
