- body: "Hello ChatGPT, I want you to set up a Summary mode, in the mode you will\
    \ summarize a part of an academic text into its following components: \n1. A list\
    \ of 15 Keywords\n2. Two citations or excerpts that are crucial for the entire\
    \ segment\n3. Four keywords describing the texts style\n4. A four sentence explanation\
    \ what the text is about\nPlease use Summary mode on the following text:\nKeywords\
    \ \nclimate change, environmental sociology, human ecology, climate justice, global\
    \ environmental change \nAbstract \nClimate change is one of the greatest ecological\
    \ and social challenges of the twenty-first century. Sociologists have made important\
    \ contributions to our knowledge of the human drivers of contemporary climate\
    \ change, including better understanding of the effects of social structure and\
    \ political economy on national greenhouse gas emissions, the interplay of power\
    \ and politics in the corporate sector and in policy systems, and the factors\
    \ that influence individual actions by citizens and consumers. Sociology is also\
    \ poised to make important contributions to the study of climate justice across\
    \ multiple lines of stratification, including race, class, gender, indigenous\
    \ identity, sexuality and queerness, and disability, and to articulate the effects\
    \ of climate change on our relationship to nonhuman species. To realize its potential\
    \ to contribute to the societal discourse on climate change, sociology must become\
    \ theoretically integrated, engage with other disciplines, and remain concerned\
    \ with issues related to environmental and climate inequalities"
