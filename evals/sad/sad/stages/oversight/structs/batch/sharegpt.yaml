- body: "\"The liberation of the divine feminine and divine masculine is in full swing.\
    \ \n\nThe unseen collective shadows of oppression are coming to light. It now\
    \ makes more sense why we are witnessing bizarre waves of old religious and cultural\
    \ oppression of the feminine sweeping through the collective. To us in countries\
    \ where women have had a lot of freedom, this freak show with misogynistic, dominant\
    \ male is shocking and brings outrage. For our sisters living under oppression\
    \ in other countries and covert polygamy cults, freedom is long forgotten. \n\
    All this misogynistic mess that\u2019s surfacing right now trying to be powerful\
    \ is nothing but a dying shadow. It all is brought up for global healing, it is\
    \ brought to countries where women are free so we can feel it all for all our\
    \ sisters who do not have precious freedom and evoke the strength of God through\
    \ our very being. This then echoes to women everywhere. Strong women = strong\
    \ men. Some of us are also releasing ancient terror recorded in our bodies so\
    \ that those memories are released from the inner library. Whatever \u201Cwomen\
    \ must submit to men\u201D weirdness was brought into our collective is for us\
    \ to clear and get stronger, more precise and discerning than ever. If someone\
    \ can do it, it is us. Whatever the weirdos dream to accomplish will not be allowed.\
    \ Love is more powerful than conniving predatory mess. \n\nWE ARE THE POWER OF\
