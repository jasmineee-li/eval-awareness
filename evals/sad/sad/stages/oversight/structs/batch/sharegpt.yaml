- body: "Imagine you are a Product Manager, hear out my idea and create a proper PRD\
    \ document that I can share with investors and VCs, make sure that we cover everything\
    \ essential to get them on board in a properly formatted manner with a professional\
    \ tone\n\nStart with a solid elevator pitch for a startup like this. \n\n- Every\
    \ other week someone is tweeting about best coworking cafes in bangalore, that\
    \ means people dont want to work from home or office, just outside office, A place\
    \ that has the vibe and help them get into the flow of working.\n- Cafes are not\
    \ meant to be for co-working, their revenue model is based on the food ordered\
    \ and a person just working there is just a person blocking table for new potential\
    \ customer\n- Though it could feel good but people joining to work calls from\
    \ cafe with choppy wifi and background noise is not the best experience for their\
    \ co-workers/team mates\n- With the power of web3, we can build a DAO that can\
    \ fund a cafe like this, if there is any existing DAO would want to get in touch\
    \ with the best talent from the Silicon Valley of India, this would be the way\
    \ for them to do it. \n- Companies and DAOs can be book seats for their employees/members\
    \ and provide a better experience for them\n- These cafes can be pre-equipped\
    \ with fast wifi, calling booths with better webcam and mic than their normal\
    \ setup \n- This cafe can be THE place for any web3 community to have their meetups\
    \ \n- The vibe of the cafe can be set by the top designers in the ecosystem and\
    \ we can showcase the NFT art of popular projects, bringing them to physical realm\n\
    - Giving people that sense of ownership that they can look into a cafe and say\
    \ that they are owner of that, a community led cafe would be some very exciting\
