- body: "\uC544\uB798\uC640 \uAC19\uC740 \uCDE8\uC57D\uC810\uC5D0 \uB300\uD574\n\n\
    cve description:\nIn Expat (aka libexpat) before 2.4.5, there is an integer overflow\
    \ in storeRawNames.\n\n\uC544\uB798 \uD568\uC218\uC5D0\uC11C \uCDE8\uC57D\uC810\
    \uC774 \uBC1C\uC0DD\uD558\uC600\uACE0\n\nstoreRawNames(XML\\_Parser parser) {\n\
    \ TAG \\*tag = parser->m\\_tagStack;\n while (tag) {\n int bufSize;\n int nameLen\
    \ = sizeof(XML\\_Char) \\* (tag->name.strLen + 1);\n char \\*rawNameBuf = tag->buf\
    \ + nameLen;\n /\\* Stop if already stored. Since m\\_tagStack is a stack, we\
    \ can stop\n at the first entry that has already been copied; everything\n below\
    \ it in the stack is already been accounted for in a\n previous call to this function.\n\
    \ \\*/\n if (tag->rawName == rawNameBuf)\n break;\n /\\* For re-use purposes we\
    \ need to ensure that the\n size of tag->buf is a multiple of sizeof(XML\\_Char).\n\
    \ \\*/\n bufSize = nameLen + ROUND\\_UP(tag->rawNameLength, sizeof(XML\\_Char));\n\
    \ if (bufSize > tag->bufEnd - tag->buf) {\n char \\*temp = (char \\*)REALLOC(parser,\
    \ tag->buf, bufSize);\n if (temp == NULL)\n return XML\\_FALSE;\n /\\* if tag->name.str\
    \ points to tag->buf (only when namespace\n processing is off) then we have to\
    \ update it\n \\*/\n if (tag->name.str == (XML\\_Char \\*)tag->buf)\n tag->name.str\
    \ = (XML\\_Char \\*)temp;\n /\\* if tag->name.localPart is set (when namespace\
    \ processing is on)\n then update it as well, since it will always point into\
    \ tag->buf\n \\*/\n if (tag->name.localPart)\n tag->name.localPart\n = (XML\\\
    _Char \\*)temp + (tag->name.localPart - (XML\\_Char \\*)tag->buf);\n tag->buf\
    \ = temp;\n tag->bufEnd = temp + bufSize;\n rawNameBuf = temp + nameLen;\n }\n\
    \ memcpy(rawNameBuf, tag->rawName, tag->rawNameLength);\n tag->rawName = rawNameBuf;\n\
    \ tag = tag->parent;\n }\n return XML\\_TRUE;\n}\n\n\uADF8 \uD328\uCE58\uAC00\
    \ \uC544\uB798\uC640 \uAC19\uC73C\uBA74\n\n--- xmlparse"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
