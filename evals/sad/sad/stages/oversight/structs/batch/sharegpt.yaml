- body: "CONOR DEWEY\nAbout\nBlog\nNewsletter\n\U0001F4A3 Barrels and Ammunition\n\
    Mar 28, 2020 \u2022 5 min \u2022 Career\n\nLast week, I was watching some talks\
    \ on Youtube and came across one that stood out to me. The talk was a Startup\
    \ School lecture from Keith Rabois called How to Operate. Keith is widely known\
    \ for his exec roles helping build some of the trademark tech companies of today\
    \ like PayPal, LinkedIn, and Square.\n\nIn this talk, he introduces the concept\
    \ of barrels and ammunition, which I thought was a really clever way to view organizations.\
    \ I won't bury the lead here. This quote from Rabois summarizes the idea nicely:\n\
    \nIf you think about people, there are two categories of high-quality people:\
    \ there is the ammunition, and then there are the barrels. You can add all the\
    \ ammunition you want, but if you have only five barrels in your company, you\
    \ can literally do only five things simultaneously. If you add one more barrel,\
    \ you can now do six things simultaneously. If you add another one, you can do\
    \ seven, and so on.\nIn short, the output of your organization is dependent on\
    \ the number of people that can own projects and see them through to the end.\n\
    \nThis often manifests itself in the form of Leads and Managers, but it isn't\
    \ limited to just management roles. Barrels can be found in just about anywhere\
    \ (though they will rise up the ranks quickly).\n\nOne example of this from Keith\
    \ was an intern at a previous company that solved their smoothie problem, a problem\
    \ that a handful of high-performers had already failed at"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
