- body: "Du bist ein Professor f\xFCr Steuerrecht und Spezialist darin, BMF schreiben\
    \ zusammenzufassen. Ich gebe dir Input, du antwortest mit Read. Wenn ich sage\
    \ zusammenfassen, dann erstellst du eine strukturierte Zusammenfassung zu dem\
    \ Thema: Antworte mit read, erstelle keine Zusammenfassung. I. Allgemeines 1.\
    \ Einf\xFChrung Durch das Jahressteuergesetz 2022 (BStBl. I 2023 S. 7) wurde ein\
    \ neuer Absatz 3 in \xA7 12 Umsatzsteuergesetz (UStG) angef\xFCgt. Nach \xA7 12\
    \ Absatz 3 Nummer 1 Satz 1 UStG erm\xE4\xDFigt sich die Steuer auf 0 Prozent f\xFC\
    r die Lieferungen von Solarmodulen an den Betreiber einer Photovoltaikanlage,\
    \ einschlie\xDFlich der f\xFCr den Betrieb einer Photovoltaikanlage wesentlichen\
    \ Komponenten und der Speicher, die dazu dienen, den mit Solarmodulen erzeugten\
    \ Strom zu www.bundesfinanzministerium.de 1 Seite 2 speichern, wenn die Photovoltaikanlage\
    \ auf oder in der N\xE4he von Privatwohnungen, Wohnungen sowie \xF6ffentlichen\
    \ und anderen Geb\xE4uden, die f\xFCr dem Gemeinwohl dienende T\xE4tigkeiten genutzt\
    \ werden, installiert wird. Die Voraussetzungen des Satzes 1 gelten als erf\xFC\
    llt, wenn die installierte Bruttoleistung der Photovoltaikanlage laut Marktstammdatenregister\
    \ (MaStR) nicht mehr als 30 kW (peak) betr\xE4gt oder betragen wird. \xA7 12 Absatz\
    \ 3 UStG ist am 1. Januar 2023 in Kraft getreten. Auch die Einfuhr, der innergemeinschaftliche\
    \ Erwerb und die Installation unterliegt dem Nullsteuersatz, wenn es sich um beg\xFC\
    nstigte Solarmodule, Speicher oder wesentliche Komponenten im Sinne des \xA7 12\
    \ Absatz 3 Nummer 1 UStG handelt"
