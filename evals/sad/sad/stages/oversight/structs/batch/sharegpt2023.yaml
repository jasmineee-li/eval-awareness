- body: "SWEN30006 Software Modelling and Design Workshop 3: Design Models and Coding\n\
    School of Computing and Information Systems University of Melbourne\nSemester\
    \ 1, 2023\n!\nAssessment: Youshouldcompletetheexercisesasateam.Toreceiveaworkshopmark,youneedto\
    \ demonstrate your active participation during the workshop. Your tutor will observe\
    \ your participation for you to be eligible to receive a mark for this workshop.\
    \ The active participation include (but not limit to) present your solutions,\
    \ help your teammates, and actively engage with the team. Attending the workshop\
    \ with only passive participation will not be given a mark. See the Workshop Overview\
    \ under Subject Information on the LMS for more details.\n Requisite Knowledge\
    \ and Tools\nTo complete this workshop you will need to be familiar with the following\
    \ terms and concepts:\n\u2022 Use cases and use case diagrams\n\u2022 Domain models\
    \ and system sequence diagrams \u2022 The representational gap\n\u2022 Object\
    \ Oriented Programming in Java\nIntroduction\nThis week workshop will move focus\
    \ to the solution space and static and dynamic design modelling. We will be considering\
    \ the relationship of the design models to the domain model and system sequence\
    \ diagrams and the representational gap between the static models. We will also\
    \ look at the transformation of the design models into Java code. Once again we\
    \ will be using Draw.IO as our supported diagramming tool.\nWe suggest you use\
    \ the textbook and resources provided in the \"Pre-Workshop Learning\" sub-module\
    \ which include UML notation references for Design Class Diagram and Design Sequence\
    \ Diagram"
