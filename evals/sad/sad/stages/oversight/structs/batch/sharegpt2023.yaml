- body: "tu va agir en prof en assembleur et expliquer des concept en rapport avec\
    \ l'assembleur IA32 AT&T, je vais te poser des question d'un TD auquel tu devra\
    \ repondre .\nvoivi le td ne repond a rien maitenant, attend que je t'envoie les\
    \ fichier et te dire quuel question repondre :\n\nINF1600\nTravail pratique 2\n\
    Architecture IA-32 et ASM\nD\xE9partement de G\xE9nie Informatique et G\xE9nie\
    \ Logiciel\nPolytechnique Montr\xE9al\nPolytechnique Montr\xE9al D\xE9partement\
    \ de G\xE9nie Informatique et G\xE9nie Logiciel\nINF1600 2/9 Hiver 2023\n1 Introduction\
    \ et sommaire\nCe travail pratique a pour but de vous familiariser avec les instructions\
    \ d\u2019assembleur IA-32 selon la syntaxe\nAT&T. Vous aurez \xE0 manipuler des\
    \ chaines de caract\xE8res et effectuer des calculs en virgule fixe et flottante.\n\
    Les probl\xE8mes consid\xE9r\xE9s traitent l\u2019adressage de la m\xE9moire,\
    \ la gestion de la pile et les instructions\narithm\xE9tiques de division et multiplication.\n\
    2 Manipulation des chaines de caract\xE8res\nCette partie traite l\u2019utilisation\
    \ des instructions assembleurs de la famille IA-32 pour manipuler les chaines\n\
    de caract\xE8res.\n2.1 Famille d\u2019instructions IA-32 pour les chaines de caract\xE8\
    res.\nIntel a cr\xE9\xE9 une famille compl\xE8te d'instructions \xE0 utiliser\
    \ pour travailler avec des donn\xE9es de type \xAB String \xBB.\nCette section\
    \ introduit un nombre d\u2019instructions assembleur pour manipuler les cha\xEE\
    nes de caract\xE8res de\nl'IA-32.\nCe type d\u2019instructions utilisent les registres\
    \ %ESI et %EDI comme pointeurs pour effectuer les op\xE9rations :\nCela veut dire\
    \ que ces registres doivent pointer vers les emplacements m\xE9moires des chaines\
    \ de caract\xE8res\n\xE0 vouloir traiter"
