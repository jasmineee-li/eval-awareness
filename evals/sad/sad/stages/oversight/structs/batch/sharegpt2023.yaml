- body: "Based on the information provided in the press release below, write a maximum\
    \ 200 words text to explain QScale. Leave out the information about \xC9nergir,\
    \ the text should only focus on QScale. Use Snoop Dog tone and style to do the\
    \ writing.\n\n''QSCALE AND \xC9NERGIR DEVELOPMENT JOIN FORCES TO DRIVE DECARBONIZATION\
    \ IN QU\xC9BEC THROUGH WASTE HEAT RECOVERY\n\nL\xE9vis, March 16, 2023 \u2013\
    \ QScale, a Qu\xE9bec company that develops environmentally responsible computing\
    \ centers, and \xC9nergir Development, hereinafter \u201C\xC9nergir,\u201D a diversified\
    \ energy company, announce a collaboration to maximize waste heat recovery in\
    \ Qu\xE9bec. \nQScale and \xC9nergir are taking real steps towards decarbonizing\
    \ Qu\xE9bec by combining their expertise in recovering and optimizing the use\
    \ of heat generated by computing centers. As part of this collaboration, QScale\
    \ will provide free waste heat from its centers. Having carried out pre-feasibility\
    \ studies and confirmed technical and economic viability, \xC9nergir will ensure\
    \ project implementation from design through to operation. \nThe first waste heat\
    \ recovery projects under this collaboration will be developed at QScale\u2019\
    s Q01 campus in L\xE9vis. They will allow reuse of the renewable energy that powers\
    \ the computing center. Opportunities are currently being analyzed and the first\
    \ delivery of recovered heat is anticipated by early 2024.\nUltimately, the Q01\
    \ campus aims to become one of the largest waste heat recovery providers of its\
    \ kind in Qu\xE9bec. Up to 96 megawatts (MW) could be distributed through energy\
    \ distribution networks, which represents enough energy to heat more than 15,000\
    \ Qu\xE9bec households"
