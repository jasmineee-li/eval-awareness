- body: "Analiza el siguiente texto: \xBFQu\xE9 pasar\xE1 en el futuro del trabajo\
    \ con quienes se limiten tanto?\n\nLa inteligencia artificial revoluciona hoy\
    \ la inteligencia natural y las noticias del mundo: tecnolog\xEDa que escribe\
    \ ensayos y mantiene conversaciones naturales, entre otras habilidades \u201C\
    creativas\u201D.\n\nLas m\xE1quinas aprenden m\xE1s r\xE1pido, sin dudas, pero\
    \ nosotros deber\xEDamos aprender mejor. Este tipo de cambios modificaron la fecha\
    \ de vencimiento del conocimiento. Es la era de aprender toda la vida.\n\nPero,\
    \ \xBFqu\xE9 talentos debemos incorporar? \xBFPara qu\xE9 espec\xEDficamente?\
    \ \xBFC\xF3mo potenciamos una suma \xFAtil de inteligencias?\n\nEn esta edici\xF3\
    n de Inspira Postgrados, en el marco de la edici\xF3n 2023 de postgrados innovadores\
    \ y disruptivos, Daniel Castro entrevista a los dos cerebros.\n\nElla es una evangelizadora\
    \ de la creatividad en las empresas, organizaciones y personas. \xC9l es un ingeniero\
    \ a la vanguardia de la tecnolog\xEDa, la innovaci\xF3n y la educaci\xF3n.\n\n\
    \U0001F449https://fcd.ort.edu.uy/escuela-de-pos...\n\n\U0001F399 Dominique Sarries\n\
    \nCon 30 a\xF1os de trayectoria como creativa publicitaria, se dedica a potenciar\
    \ la creatividad en empresas, organizaciones, en la ense\xF1anza y vida de la\
    \ gente. Fundadora de \u201CEmpoderamiento Creativo\u201D, desarrolla charlas\
    \ para estimular la creatividad para innovar, liderar, emprender, transformar\
    \ problemas en grandes ideas y generar grandes cambios, tanto en lo personal como\
    \ en lo profesional.\n\n\U0001F399 Ing. Eduardo Mangarelli\n\nDecano de la Facultad\
    \ de Ingenier\xEDa de la Universidad ORT Uruguay. Graduado en Ingenier\xEDa en\
    \ Sistemas por la Universidad ORT Uruguay"
  choices_right:
  - 'No'
  choices_wrong:
  - 'Yes'
