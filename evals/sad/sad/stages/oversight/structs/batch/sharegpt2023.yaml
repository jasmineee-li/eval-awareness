- body: "Good morning. My healthcare organization participated in an quality improvement\
    \ program, which affect our revenue. Below is the explanation of how the payment\
    \ is determined. I need you to help me to understand this policy. I am a \"high-needs\"\
    \ entity, I am subject to which quality measures? I am in PY2022 now. 1.1 Application\
    \ of Quality Assessment to Final Financial Reconciliation\nThe process of determining\
    \ the impact of quality measurement and performance on the PY Benchmark is summarized\
    \ in this section using PY2022 as an example. The steps are as follows:\n\n\u2022\
    \ CMS develops Quality Benchmarks for each P4P measure.\n\u2022 Component Quality\
    \ Scores are calculated: P4R Quality Measures are assessed, and P4P Quality Measures\
    \ are compared against their Quality Benchmarks to determine performance levels.\n\
    \u2022 Component Quality Scores are weighted to calculate the Total Quality Score.\n\
    \u2022 (PY2023\u2013PY2026 only) CI/SEP criteria are assessed to determine the\
    \ amount of the Quality Withhold to which the Total Quality Score will be applied.\n\
    \u2022 (PY2023\u2013PY2026 only) HPP funds are distributed.\n\n1.1.1 Step 1. CMS\
    \ Develops Quality Benchmarks for Each P4P Measure\nIn PY2022, ACR and UAMCC will\
    \ have P4P components. These measures assess the occurrence of undesirable outcomes\u2014\
    thus, lower measure scores represent better performance. Performance levels for\
    \ each DCE are determined by comparing their Quality Measure scores with the relevant\
    \ Quality Benchmark. The DCE earns a performance level for each measure based\
    \ on where the measure score falls in comparison to the benchmark threshold values"
