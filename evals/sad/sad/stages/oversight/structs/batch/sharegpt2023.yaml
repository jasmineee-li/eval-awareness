- body: "\uC774 \uCFFC\uB9AC\uB97C \uAD6C\uD604\uD55C \uC0AC\uB78C\uC758 \uC218\uC900\
    \uC744 \uD3C9\uAC00\uD558\uC790\uBA74?\n\nUSE SUNMES;\n\nWITH ITEM\\_LIST AS (\n\
    \ SELECT \\* FROM (\n VALUES \n ('mt', 'mt')\n ,('mt', 't2')\n ,('fb', 'fb')\n\
    \ ,('tr', 'tr')\n ,('tr', 't1')\n ,('tr', 't3')\n ,('tr', 'e1')\n ,('st', 'st')\n\
    \ ,('st', 'cc')\n ,('st', 'at')\n ,('bx', 'bx')\n ,('bx', 'b1')\n ,('hv', 'mv')\n\
    \ ,('hv', 'mh')\n ,('hv', 'sv')\n ,('hv', 'sh')\n ,('hv', 'rh')\n ,('hv', 'e2')\n\
    \ ) AS col(type, itemcd)\n)\n,ALL\\_ITEMS AS ( \n SELECT \n itemcd\n ,totwgt\\\
    _d = SUM(CASE WHEN condat = '20230322' THEN totwgt ELSE 0 END)\n ,conprc\\_d =\
    \ SUM(CASE WHEN condat = '20230322' THEN conprc ELSE 0 END) / 1000\n ,totwgt\\\
    _m = SUM(CASE WHEN condat BETWEEN '20230301' AND '20230323' \n THEN totwgt ELSE\
    \ 0 END) \n ,conprc\\_m = SUM(CASE WHEN condat BETWEEN '20230301' AND '20230323'\
    \ \n THEN conprc ELSE 0 END) / 1000\n ,totwgt\\_y = SUM(CASE WHEN condat BETWEEN\
    \ '20230101' AND '20230323' \n THEN totwgt ELSE 0 END)\n ,conprc\\_y = SUM(CASE\
    \ WHEN condat BETWEEN '20230101' AND '20230323' \n THEN conprc ELSE 0 END) / 1000\n\
    \ FROM UTB\\_MES\\_EP\\_PORDER\n WHERE condat BETWEEN '20230101' AND '20230323'\
    \ \n AND itemcd IN (SELECT itemcd FROM ITEM\\_LIST)\n GROUP BY itemcd\n)\n,TYPE\\\
    _SUM AS(\n SELECT\n type\n ,totwgt\\_d = SUM(totwgt\\_d)\n ,conprc\\_d = SUM(conprc\\\
    _d)\n ,totwgt\\_m = SUM(totwgt\\_m) \n ,conprc\\_m = SUM(conprc\\_m)\n ,totwgt\\\
    _y = SUM(totwgt\\_y)\n ,conprc\\_y = SUM(conprc\\_y)\n FROM ALL\\_ITEMS\n LEFT\
    \ JOIN ITEM\\_LIST\n ON ALL\\_ITEMS.itemcd = ITEM\\_LIST.itemcd\n GROUP BY type\n\
    )\n,SUMMARY AS (\n SELECT \\* FROM (\n SELECT \n type = 'sm'\n ,totwgt\\_d = SUM(totwgt\\\
    _d)\n ,conprc\\_d = SUM(conprc\\_d)\n ,totwgt\\_m = SUM(totwgt\\_m) \n ,conprc\\\
    _m = SUM(conprc\\_m)\n ,totwgt\\_y = SUM(totwgt\\_y)\n ,conprc\\_y = SUM(conprc\\\
    _y)\n FROM ALL\\_ITEMS\n ) ALL\\_SUM\n UNION ALL\n SELECT \\* FROM TYPE\\_SUM\n\
    )\nSELECT \\* \nFROM SUMMARY\nORDER BY CASE type\n WHEN 'sm' THEN 1\n WHEN 'mt'\
    \ THEN 2\n WHEN 'fb' THEN 3\n WHEN 'tr' THEN 4\n WHEN 'st' THEN 5"
