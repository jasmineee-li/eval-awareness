- body: "Can you provide a summary of this?\nReport by Human Rights Watch details\
    \ alleged attacks using explosive weapons and small arms on Saudi Arabia-Yemen\
    \ border Saudi border guards have been accused of killing hundreds of Ethiopians\
    \ using small arms and explosive weapons in a targeted campaign that rights advocates\
    \ suggest may amount to a crime against humanity. The shocking claims are made\
    \ ina detailed investigation by Human Rights Watch, which interviewed dozens of\
    \ Ethiopian people who said they were attacked by border guards while they tried\
    \ to cross into Saudi Arabia from Yemen. Last week Downing Street confirmed that\
    \ Rishi Sunak plans to welcome Saudi Arabia\u2019s crown prince Mohammed bin Salman\
    \ to London \u201Cat the earliest opportunity\u201D. It would be the first visit\
    \ since the death in 2018 of the Saudi dissident Jamal Khashoggi, whoUS intelligence\
    \ believe was murderedand dismembered by Saudi agents in Istanbul on the orders\
    \ of Prince Mohammed. Using satellite imaging, photographs of deaths from more\
    \ than 20 incidents, witness testimony by survivors and forensic experts\u2019\
    \ examination of survivors\u2019 wounds, HRW has built up a compelling and horrific\
    \ picture of an escalating campaign of extreme violence aimed at people trying\
    \ to cross the border. Witness testimony describes mass killings, with women and\
    \ children dying in shelling, and dead people and body parts spread along trails.\
    \ \u201CI saw people killed in a way I have never imagined,\u201D Hamdiya, a 14-year-old\
    \ girl who crossed the border in a group of 60 in February, told researchers"
