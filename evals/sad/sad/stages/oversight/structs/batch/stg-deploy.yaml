- body: "Read the following abstract, then summarize it in one sentence:\n\nAbstract:Traditional\
    \ spectral energy distribution (SED) fitting techniques face uncertainties due\
    \ to assumptions in star formation histories and dust attenuation curves. We propose\
    \ an advanced machine learning-based approach that enhances flexibility and uncertainty\
    \ quantification in SED fitting. Unlike the fixed NGBoost model used in mirkwood,\
    \ our approach allows for any sklearn-compatible model, including deterministic\
    \ models. We incorporate conformalized quantile regression to convert point predictions\
    \ into error bars, enhancing interpretability and reliability. Using CatBoost\
    \ as the base predictor, we compare results with and without conformal prediction,\
    \ demonstrating improved performance using metrics such as coverage and interval\
    \ width. Our method offers a more versatile and accurate tool for deriving galaxy\
    \ physical properties from observational data.\n    "
