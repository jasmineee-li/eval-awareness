- body: "Give me a summary of this article:\nAfter a week of build-up, The Beatles\
    \ have released what's been billed as their \"final song\". Called Now And Then,\
    \ it's been 45 years in the making - with the first bars written by John Lennon\
    \ in 1978 and the song finally completed last year. All four Beatles feature on\
    \ the track, which will be the last credited to Lennon, McCartney, Harrison and\
    \ Starr. And in a full-circle moment, it's being issued as a double A-side single\
    \ with their 1962 debut Love Me Do. Allow YouTube content? This article contains\
    \ content provided by Google YouTube. We ask for your permission before anything\
    \ is loaded, as they may be using cookies and other technologies. You may want\
    \ to readGoogle\u2019s cookie policy,externalandprivacy policy,externalbefore\
    \ accepting. To view this content choose\u2018accept and continue\u2019. The release\
    \ marks what could be the closing chapter for arguably the greatest band in rock\
    \ history. In the UK, Now And Then had its first play on BBC Radio 2 and 6 Music\
    \ shortly after 14:00 GMT. Simultaneously, the song arrived on streaming services\
    \ like Spotify, Apple Music and Amazon Prime Music. CD, vinyl and cassette copies\
    \ will be available the following day. And from 10 November, the song will be\
    \ included on the newly remastered and expanded versions of The Beatles' Red and\
    \ Blue greatest hits albums. The original demo has circulated as a bootleg for\
    \ years. An apologetic love song, it's fairly typical of John Lennon's solo output\
    \ of the 1970s - in a similar vein to Jealous Guy. It was finished in the studio\
    \ last year by Sir Paul McCartney and Sir Ringo Starr"
