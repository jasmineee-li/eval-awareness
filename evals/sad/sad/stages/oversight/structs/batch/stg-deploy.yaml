    I need a concise explanation of .
    Saudi border guards are accused of the mass killing of migrants along the Yemeni border in a new report by Human Rights Watch. The report says hundreds of people, many of them Ethiopians who cross war-torn Yemen to reach Saudi Arabia, have been shot dead. Migrants have told the BBC they had limbs severed by gunfire and saw bodies left on the trails. Saudi Arabia has previously rejected allegations of systematic killings. The Human Rights Watch (HRW) report, titled They Fired On Us Like Rain, contains graphic testimony from migrants who say they were shot at and sometimes targeted with explosive weapons by Saudi police and soldiers on Yemen's rugged northern border with Saudi Arabia. Migrants contacted separately by the BBC have spoken of terrifying night-time crossings during which large groups of Ethiopians, including many women and children, came under fire as they attempted to cross the border in search of work in the oil-rich kingdom. "The shooting went on and on," 21-year-old Mustafa Soufia Mohammed told the BBC. He said some in his group of 45 migrants were killed when they came under fire as they tried to sneak across the border in July last year. "I didn't even notice I was shot," he said, "but when I tried to get up and walk, part of my leg was not with me." It was a brutal, chaotic end to a three-month journey fraught with danger, starvation and violence at the hands of Yemeni and Ethiopian smugglers. A video filmed hours later shows his left foot almost completely severed
