- body: "Could you give me a brief rundown of this?\nIt\u2019s time to wrap up the\
    \ OBO for today, and indeed the 2023 World Cup.Even a relatively modest tournament\
    \ has left us with dozens of vivid memories: Virat Kohli\u2019s 50th hundred,\
    \ Angelo Mathews being timed out, Ibrahim Zadran\u2019s historic century, Mohammad\
    \ Shami the human statgasm, Glenn Maxwell\u2019s double hundred, England being\
    \ fried in Mumbai against South Africa, the spine-tingling elegance of Rachin\
    \ Ravindra and many more. The abiding memory is usually the last one. This time\
    \ it\u2019ll be Travis Head pulverising an all-time-great bowling attack and Australia\
    \ winning an apparently unwinnable final at a canter. It\u2019ll be a while before\
    \ anyone writes them off again. On behalf of all the OBO writers, thanks for your\
    \ company and emails throughout the tournament. And don\u2019t worry, there\u2019\
    s a 20-over World Cup next year."
