    I need a concise explanation of .
    Storm marks first time in recorded history eastern Pacific has had a hurricane remain at category 5 after making landfall On Wednesday, Hurricane Otis rapidly developed across the eastern Pacific beforemaking landfall near Acapulco in southern Mexicoas a category 5 hurricane with wind speeds estimated at about 165mph. This marked the first time in recorded history that the eastern Pacific has had such a strong hurricane make landfall and continue with category-5 intensity, surpassing Hurricane Patricia in 2015, which had wind speeds of about 150mph after it struck land. The intensity and track of Otis were notably different from the forecasts provided by the US National Hurricane Center (NHC), with models initially having suggested that Otis would move westwards as a tropical storm when it first formed three days before making landfall. Even 24 hours before the hurricane reached category 5 status, the NHC only predicted peak winds of about 70mph. However, Otis rapidly intensified en route to making landfall inMexico, with winds increasing by about 70mph in just 12 hours, leaving little time for preparations to be made. This rapid intensification was one of the largest on record in the eastern Pacific and was fuelled by high ocean temperatures and reduced wind shear, which refers to a change in wind speed or direction with a change in height. The rapid and unexpected intensification of Otis was not accurately captured by weather models, in part because of limited data availability, with no radar available in the area it made landfall and only one flight taking place to make observations
