- body: "Any typos here?\nSAN DIEGO and TORONTO, Dec.  09, 2023  (GLOBE NEWSWIRE)\
    \ -- Aptose Biosciences Inc. (\u201CAptose\u201D or the \u201CCompany\u201D) (NASDAQ:\
    \ APTO, TSX: APS),\_a clinical-stage precision oncology company developing highly\
    \ differentiated targeted agents to treat hematologic malignancies, today announced\
    \ that a growing body of clinical data for Aptose\u2019s lead compound tuspetinib\
    \ (TUS), demonstrates significant benefit as a single agent and in combination\
    \ with venetoclax (VEN) in patients with relapsed or refractory acute myeloid\
    \ leukemia (R/R AML) in the ongoing APTIVATE Phase 1/2 study. Data were presented\
    \ in an oral presentation today at the 65thAmerican Society of Hematology (ASH)\
    \ Annual Meeting and Exposition by lead investigator Naval G. Daver, M.D., Professor,\
    \ Director Leukemia Research Alliance Program, Department of Leukemia, The University\
    \ of Texas MD Anderson Cancer Center, Houston, TX.\nTuspetinib is a once-daily,\
    \ oral, precision targeted kinase inhibitor that suppresses select kinases that\
    \ drive the proliferation of AML. These key kinase targets include the SYK, FLT3,\
    \ JAK1/2, mutant forms of KIT, RSK2, and the TAK1-TAB1 kinases operative in AML,\
    \ while avoiding non-therapeutic kinase targets to promote safety.\nDr. Daver\
    \ reported data from more than 100 relapsed/refractory patients from multiple\
    \ international clinical sites, who had failed prior therapy and then were treated\
    \ with tuspetinib (TUS) as a single agent or tuspetinib in combination with venetoclax\
    \ (TUS/VEN). TUS and TUS/VEN delivered multiple composite complete remissions\
    \ (CRcs) in this very ill AML population, while maintaining a favorable safety\
    \ profile across all treated patients"
