- body: "Bullet points summary of:\nPoland\u2019s populist ruling party appeared to\
    \ be on the brink of losing power, after an exit poll in abitter and high-stakes\
    \ national electionpredicted that the country\u2019s opposition has the clearest\
    \ path to forming its next government. The poll projected that the Law and Justice\
    \ party, known by its Polish acronym PiS, would win the most seats after Sunday\u2019\
    s vote. But it would fall some way short of a parliamentary majority, and the\
    \ opposition bloc \u2013 led by former Polish prime minister and European Council\
    \ president Donald Tusk \u2013 appeared on course to gain control if it struck\
    \ deals with smaller parties. Record numbers of voters turned out to cast their\
    \ ballots, the National Electoral Commission said on Monday, underscoring the\
    \ pivotal importance of this election. The exit poll suggested that turnout was\
    \ 73%, the highest in any Polish parliamentary vote.Both Tusk and Jaroslaw Kaczynski,\
    \ the PiS chairman and Poland\u2019s de facto leader, attempted to declare victory\
    \ on Sunday night. In reality, however, days of negotiations may lie ahead until\
    \ the make-up of the country\u2019s new government becomes clear. \u201CThe exit\
    \ poll results give us the fourth victory in the history of our party in the parliamentary\
    \ elections and the third victory in a row; this is a great success of our formation\
    \ and our project for Poland,\u201D Kaczynski told supporters. But in an admission\
    \ of the tall order facing his party, he added: \u201CWe still face the question\
    \ of whether this success will be able to be transformed into another term of\
    \ office of our government"
