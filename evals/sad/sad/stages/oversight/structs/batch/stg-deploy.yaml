    This video can not be played Watch: Thousands evacuate as wildfires spread across Rhodes Thousands of people have been evacuated from homes and hotels on the Greek island of Rhodes after wildfires engulfed large parts of the island. Greece's fire service told the BBC it apologises for what it called "a mess" on the island, warning that the situation could worsen due to weather. More than 3,500 people have been evacuated by land and sea to safety. A further 1,200 will be evacuated from three villages - Pefki, Lindos and Kalathos. No injuries have been reported, according to the Ministry of Climate Crisis and Civil Protection in Greece. It said visitors are being evacuated safely from the affected areas of Rhodes - which represent less than 10% of the island's tourist accommodation - and are being redirected to other hotels on the island. Lt Col Yannis Artopoios, spokesperson of the Hellenic Fire Corps, described the fires as the most difficult the service has faced. The island has been battling wildfires fanned by strong winds since Tuesday, as Europe deals with a challenging heatwave. Five helicopters and 173 firefighters were operating in the area, with three hotels in the Kiotari area reported to have been damaged by fire. The areas of Laerma, Lardos and Asklipio were also affected. Private boats joined the Greek coastguard in helping to pick up people from beaches on the east of the island. Greek navy vessels were also reported to be heading to the area, which is popular with tourists
