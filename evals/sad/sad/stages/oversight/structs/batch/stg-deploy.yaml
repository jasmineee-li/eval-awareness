- body: "summarize:\nHis progressive party may have won more votes than any other\
    \ inThailand\u2019s election in May, sparking hopes of change for the country\u2019\
    s political system, but Pita Limjaroenrat\u2019s bid to become the next Prime\
    \ Minister was just rejected by an unelected senate in the Thai parliament\u2019\
    s first round of voting for its next leader. It\u2019s a sharp blow to the pro-democracy\
    \ movement in a country that has spent the last nine years ruled by a military-backed\
    \ government. Pita\u2019s Move Forward Party had promised to steer Thailand sharply\
    \ onto a more progressive path, with policies such as legalizing same-sex marriage\
    \ and reforming stringent royal defamation laws\u2014winning widespread public\
    \ support amid simmering frustrations at the country\u2019s conservative establishment.\
    \ But by Thursday night local time in Bangkok, after five hours of debate and\
    \ a two-hour roll-call vote, Pita fell well short of the 375 votes he would need\
    \ to be confirmed as Prime Minister. He came into the session with the backing\
    \ of a 312-member coalition of the National Assembly\u2019s newly-elected 500-member\
    \ lower house but received the support of only 13 of 249 junta-appointed senators.\
    \ But with 705 votes cast before the session adjourned, Pita mustered a total\
    \ of just 324 votes in favor of his candidacy with 182 votes cast against him\
    \ and 199 abstentions, which effectively count as votes against. \u201CThe result\
    \ was entirely predictable,\u201D Mark S. Cogan, an associate professor of peace\
    \ and conflict studies at Japan\u2019s Kansai Gaidai University, tells TIME"
