- body: "I need a concise explanation of .\nBelgium\u2019s Jordi Meeus, of the Bora-Hansgrohe\
    \ team, won the final stage of the 2023Tour de France, outsprinting his compatriot\
    \ Jasper Philipsen on the cobbled finish on the Champs-\xC9lys\xE9es. While Meeus\
    \ celebrated,Jonas Vingegaardcrossed the finish line with his teammates, arms\
    \ raised in celebration, as he won his second consecutive Tour. The Danish rider\u2019\
    s overall victory was emphatic and, unlike last summer, he now plans to race in\
    \ August\u2019s Vuelta a Espa\xF1a as his Jumbo-Visma team, winners this year\
    \ of the Giro d\u2019Italia through Primoz Roglic, bid to complete a Grand Tour\
    \ grand slam. Tadej Pogacar, runner-up in the Tour, is also planning to compete\
    \ in Spain. Not for the first time, Pogacar attempted to steal a march on his\
    \ rival, attacking alone on the entry to the climactic circuits on the Champs-\xC9\
    lys\xE9es. The Slovenian\u2019s surprise move had no prospect of reducing the\
    \ seven-and-a half-minute gap between the pair, but did enough to draw other riders\
    \ out of the peloton. Although he was quickly caught up, Pogacar\u2019s move initiated\
    \ a further spate of tentative attacks, but there was nothing that could prevent\
    \ the usual sprint finish. Meanwhile, Mark Cavendish, who has yet to decide whether\
    \ to postpone his retirement, is expected to meet his Astana Qazaqstan team manager\
    \ Alexander Vinokourov, as the Tour ends. \u201CI hope we can talk calmly face\
    \ to face,\u201D Vinokourov toldCyclingNews."
