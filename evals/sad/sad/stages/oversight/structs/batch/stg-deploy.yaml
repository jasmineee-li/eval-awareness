- body: "I need a concise explanation of .\nFire department says 19,000 people have\
    \ been moved on island where blazes are spreading uncontrollably Greece has mounted\
    \ its biggest evacuation ever, moving thousands of men, women and children from\
    \ villages and resorts on Rhodes as wildfires fanned by high-speed winds raged\
    \ for a sixth day. The country\u2019s fire department said 19,000 people \u2013\
    \ mostly tourists in hotels \u2013 had been moved as blazes continued to spread\
    \ uncontrollably on three fronts across the Aegean island. About 16,000 were transferred\
    \ by land, the rest by sea. \u201CIt is the biggest operation to safely transport\
    \ residents and tourists that has ever been carried out in our country,\u201D\
    \ said a Greek fire brigade spokesperson, Ioannis Artopios, on Sunday afternoon.\
    \ Greece\u2019s economy is highly dependent on tourism \u2013 it accounts for\
    \ 25% of GDP and one in five jobs \u2013 and authorities acted quickly to ensure\
    \ that holidaymakers were moved out of harm\u2019s way as the infernos ripped\
    \ through pine forests on the island popular for its beaches and ancient ruins.\
    \ The tourism minister, Olga Kefalogianni, is on her way to Rhodes. On what was\
    \ being called the hottest July weekend in 50 years in Greece, temperatures were\
    \ predicted to reach 45C (113F). The hot, dry, windy conditions are perfect fuel\
