- body: "Summarize the following news article in one paragraph:\nPortuguese Prime\
    \ Minister Ant\xF3nio Costa resigned after investigators searched his official\
    \ residence in an inquiry into alleged corruption. He said he had not been named\
    \ as a suspect but believed the inquiry was incompatible with staying in office.\
    \ Prosecutors said on Tuesday they were investigating concessions awarded for\
    \ lithium mines and hydrogen production. They said detention warrants were issued\
    \ for five people including Mr Costa's chief of staff, V\xEDtor Esc\xE1ria. P\xFA\
    blico newspaper reported that Mr Esc\xE1ria had been detained. Infrastructure\
    \ Minister Jo\xE3o Galamba has meanwhile been indicted as part of the inquiry\
    \ into energy deals. \"The dignity of the functions of prime minister is not compatible\
    \ with any suspicion about his integrity, his good conduct and even less with\
    \ the suspicion of the practice of any criminal act,\" the prime minister said\
    \ in a televised address on Tuesday. Mr Costa said he was caught by surprise by\
    \ the corruption investigation but promised to collaborate with it. \"There is\
    \ no illicit act that weighs on my conscience, or even any censurable act,\" he\
    \ added. President Marcelo Rebelo de Sousa said he had accepted the prime minister's\
    \ resignation and summoned political parties for consultations on Wednesday. The\
    \ political crisis unfolded after prosecutors published a statement detailing\
    \ searches in more than 40 different premises as part of the inquiry. Prosecutors\
    \ are investigating alleged corruption and influence peddling in lithium mining\
    \ concessions in northern Portugal, as well as a hydrogen production project and\
    \ the planned construction of a data centre in the deep-water port of Sines, south\
    \ of Lisbon"
