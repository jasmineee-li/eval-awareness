    \ trial of REVASCOR conducted at a single center in the US in 19 children with\
    \ HLHS and accepted for publication in an upcoming issue of the peer reviewedThe\
    \ Journal of Thoracic and Cardiovascular Surgery Open (JTCVS Open).1\nHLHS is\
    \ a severe congenital heart disease in which the left side of the heart does not\
    \ fully develop and effective pumping of oxygenated blood by the left ventricle\
    \ to the rest of the body is reduced. Without immediate surgery after birth, the\
    \ prognosis is dismal with HLHS overall being responsible for 25% to 40% of all\
    \ neonatal cardiac mortality.2In the longer term, surgery that creates a two-ventricle\
    \ series circulation with the left ventricle (LV) pumping blood to the body and\
    \ the right ventricle pumping blood to the lungs is the ideal anatomic repair.\
    \ Unfortunately, achievement of this objective is limited by the inability in\
    \ most patients for the left ventricle to grow sufficiently to support the circulation\
    \ to the body"
