- body: "\uB108\uB294 \uC18C\uAD6C\uC810\uC5D0 \uB300\uD574\uC11C \uC798 \uC774\uD574\
    \uD558\uACE0 \uC788\uB294 \uBB34\uC5C7\uC774\uB4E0 \uD310\uB9E4\uD560 \uC218 \uC788\
    \uB294 \uD37C\uB110 \uB9C8\uCF00\uD305 \uC804\uBB38\uAC00\uC57C.\n\n\uB2E8 \uD55C\
    \uC7A5\uC758 \uB9F5\uC73C\uB85C \uBCF4\uB294\n<\uB9C8\uCF00\uD305 \uC124\uACC4\
    \uC790>\n2023 \uD559\uBE44\uACF5 \uB9C8\uCF00\uD305 \uCF58\uC11C\uD2B8\n2023.03.20.9.\
    \ 22:00\n\n\uD559\uBE44\uACF5 '\uB9C8\uC2E0' \uC9C1\uAC15\n\n\uC778\uC2A4\uD0C0\
    \ \uC720\uD29C\uBE0C \uBE14\uB85C\uADF8 \uC5C6\uC774\n\uC218\uB9CE\uC740 \uACE0\
    \uAC1D\uB4E4\uC744 \uBAA8\uAC1D\uD558\uACE0\n\uACE0\uAC00\uC0C1\uD488\uC744 \uD314\
    \ \uC218 \uC788\uB294 \uBC29\uBC95\n\n\uC5C4\uCCAD\uB09C \uB178\uD558\uC6B0\uAC00\
    \ \uACE7 \uACF5\uAC1C\uB429\uB2C8\uB2E4\n\uC774 \uD3EC\uC2A4\uD130\uB294 \uD558\
    \uB8E8\uB9CC\uC5D0 \uC218\uAC15\uC2E0\uCCAD\uC790 500\uBA85\uC744 \uBAA8\uC740\
    \ \uC815\uB9D0 \uAC15\uB825\uD55C \uCE74\uD53C\uB77C\uC774\uD305\uC774\uC57C.\n\
    \uC704 \uC608\uC2DC\uB97C \uC131\uACF5\uBAA8\uB378\uB85C \uC124\uC815\uD558\uACE0\
    \ \uB0B4 \uBB34\uB8CC\uD2B9\uAC15\uC744 \uC2E0\uCCAD\uD560 \uC0AC\uB78C\uB4E4\uC5D0\
    \uAC8C \uAC15\uB825\uD55C \uCC38\uC5EC\uB97C \uC720\uB3C4\uD558\uACE0\uC2F6\uC5B4\
    .\n\uC544\uB798\uC758 \uC815\uBCF4\uB97C \uCC38\uACE0\uD574\uC11C \uB9CC\uB4E4\
    \uC5B4\uC918\n\n\uC8FC\uC81C\uC640 \uBAA9\uC801 : \uC0DD\uC131\uD615 Ai \uBBF8\
    \uB4DC\uC800\uB2C8\uB97C \uD65C\uC6A9\uD558\uC5EC \uC608\uC05C \uD504\uB85C\uD544\
    \ \uC0AC\uC9C4 \uB9CC\uB4E4\uAE30\n\n\uD2B9\uAC15 \uC77C\uC2DC \uBC0F \uC7A5\uC18C\
    \ : 2023\uB144 3\uC6D4 29\uC77C \uC624\uD6C4 8\uC2DC \uC628\uB77C\uC778 \uC90C\
    \ \uD68C\uC758\uC2E4(\uC2DC\uC791 \uC9C1\uC804\uC5D0 \uBB38\uC790\uB85C \uBC1C\
    \uC1A1)\n\n\uAC15\uC0AC \uC815\uBCF4 : \uD55C\uB2EC\uB9CC\uC5D0 \uAD6C\uB3C5\uC790\
    \ 500\uBA85 \uC720\uD29C\uBC84, 20\uB144\uCC28 \uC0AC\uC9C4\uC791\uAC00\n\n\uD2B9\
    \uAC15\uC758 \uD575\uC2EC \uB0B4\uC6A9 : \uC774\uC81C\uB294 \uADF8\uB9BC\uC744\
    \ \uADF8\uB9B4\uC904 \uBAB0\uB77C\uB3C4 \uB204\uAD6C\uB098 \uC27D\uAC8C \uBBF8\
    \uB4DC\uC800\uB2C8\uB97C \uD65C\uC6A9\uD574\uC11C \uADF8\uB9BC\uC744 \uB9CC\uB4E4\
    \uACE0 \uB0B4 \uAC1C\uC131\uC744 \uBF50\uB0BC \uC218 \uC788\uB2E4 \uADF8\uB9AC\
    \uACE0 \uC774\uAC83\uC740 \uB098\uC758 \uC5F0\uBD09\uC744 \uC62C\uB824\uC900\uB2E4\
    \n\n\uCC38\uAC00\uC790 \uD61C\uD0DD : \uBBF8\uB4DC\uC800\uB2C8 \uD504\uB86C\uD504\
    \uD2B8 10\uAC00\uC9C0, \uBBF8\uB4DC\uC800\uB2C8 \uD65C\uC6A9 \uBA54\uB274\uC5BC\
    \ \uC18C\uCC45\uC790 \uC81C\uACF5\n\n\uCC38\uAC00 \uC2E0\uCCAD \uBC29\uBC95 :\
    \ \uAD6C\uAE00 \uD3FC \uC2E0\uCCAD \uD6C4, \uCC44\uD305\uBC29\uC5D0 \uC2E0\uCCAD\
    \uC644\uB8CC \uBA54\uC2DC\uC9C0 \uC785\uB825\n\n\uC2DC\uAC01\uC801 \uC694\uC18C\
    \ : \uC0AC\uB78C\uB4E4\uC774 \uC9D1\uC911\uB418\uACE0 \uC911\uC694\uD55C \uBD80\
    \uBD84\uC744 \uC798 \uC774\uD574\uD560 \uC218 \uC788\uB3C4\uB85D \uAC04\uB2E8\uBA85\
    \uB8CC\uD558\uAC8C"
