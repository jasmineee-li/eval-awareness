- body: "Read the following abstract, then summarize it in one sentence:\n\nAbstract:With\
    \ the rapid development of deep learning (DL) in recent years, automatic modulation\
    \ recognition (AMR) with DL has achieved high accuracy. However, insufficient\
    \ training signal data in complicated channel environments and large-scale DL\
    \ models are critical factors that make DL methods difficult to deploy in practice.\
    \ Aiming to these problems, we propose a novel neural network named convolution-linked\
    \ signal transformer (ClST) and a novel knowledge distillation method named signal\
    \ knowledge distillation (SKD). The ClST is accomplished through three primary\
    \ modifications: a hierarchy of transformer containing convolution, a novel attention\
    \ mechanism named parallel spatial-channel attention (PSCA) mechanism and a novel\
    \ convolutional transformer block named convolution-transformer projection (CTP)\
    \ to leverage a convolutional projection. The SKD is a knowledge distillation\
    \ method to effectively reduce the parameters and complexity of neural networks.\
    \ We train two lightweight neural networks using the SKD algorithm, KD-CNN and\
    \ KD-MobileNet, to meet the demand that neural networks can be used on miniaturized\
    \ devices. The simulation results demonstrate that the ClST outperforms advanced\
    \ neural networks on all datasets. Moreover, both KD-CNN and KD-MobileNet obtain\
    \ higher recognition accuracy with less network complexity, which is very beneficial\
    \ for the deployment of AMR on miniaturized communication devices.\n    "
