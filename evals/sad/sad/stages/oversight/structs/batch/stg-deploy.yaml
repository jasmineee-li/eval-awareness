- body: "summarize:\nMichael Kors and Kate Spade are about to become siblings. Tapestry\
    \ Inc., which owns Kate Spade and Coach, announced Thursday that it\u2019s acquiring\
    \ Capri Holdings, the parent company of Michael Kors and Versace. The $8.5 billion\
    \ deal could help them better compete against their higher-end European rivals.\
    \ Once the deal closes, slated for the end of 2024, the combined business will\
    \ consist of \u201Csix highly complementary brands with global reach,\u201D the\
    \ companies announced, with projected annual sales of more than $12 billion across\
    \ more than 75 countries. The companies project $200 million in savings from synergies\
    \ within three years of the deal closing. \u201CThe combination of Coach, Kate\
    \ Spade, and Stuart Weitzman together with Versace, Jimmy Choo, and Michael Kors\
    \ creates a new powerful global luxury house, unlocking a unique opportunity to\
    \ drive enhanced value for our consumers, employees, communities, and shareholders\
    \ around the world,\u201D Tapestry CEO Joanne Crevoiserat said in a statement.\
    \ Under terms of the deal, Capri shareholders will get $57 per share. The stock\
    \ soared 60% in early trading, while Tapestry shares were fell nearly 6%. Both\
    \ of the companies have changed their parent company names in recent years as\
    \ they grew their portfolio of fashion brands. Coach changed its parent name toTapestry\
    \ in 2017and Michael Kors switched to Capri after it boughtVersace in 2018.(The\
    \ companies didn\u2019t say if the Tapestry name will be kept following the acquisition\u2019\
    s closure.) Thursday\u2019s announcement was a logical step for the brands, because\
    \ both have been expanding in recent years, according to Neil Saunders, managing\
    \ director of GlobalData"
