    summarize this:
    This video can not be played King Charles III addresses the UK AI Summit King Charles says the risks of artificial intelligence (AI) need to be tackled with "a sense of urgency, unity and collective strength". He made the remarks in a taped address to attendees at the UK's AI Safety Summit. As the global meeting opened, the UK government unveiled a "world first agreement" on how to manage the riskiest forms of AI. The Bletchley Declaration's signatories include the US, the EU and China. The summit focuses on so-called "frontier AI" - by which ministers mean highly advanced forms of the tech with as-yet unknown capabilities. Ahead of the meeting, Tesla and X owner Elon Musk, who is attending, said he thinks AI could lead to humanity's extinction - without any detail on how that could actually happen in reality. Others have warned against speculating about unlikely future threats and said the world should instead focus on the potential present-day risks AI poses, such as replacing some jobs and entrenching bias. In his address, King Charles called the development of advanced AI "no less important than the discovery of electricity". He said tackling the risks of AI would, like efforts to combat climate change, need to involve conversations across societies, governments, civil society and the private sector. The UK government said the Bletchley Declaration, which attendees have signed, has seen 28 countries agree there is an urgent need to understand and collectively manage potential AI risks
