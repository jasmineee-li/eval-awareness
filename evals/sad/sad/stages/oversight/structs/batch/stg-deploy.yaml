    Google has released an artificial intelligence (AI) model which it claims has advanced "reasoning capabilities" to "think more carefully" when answering hard questions. AI content generators are known to sometimes invent things, which developers call hallucinations. Gemini was tested on its problem-solving and knowledge in 57 subject areas including maths and humanities. Boss Sundar Pichai said it represented a "new era" for AI. Google adopted a cautious approach to the launch of its AI chatbot, Bard, earlier this year, describing it as "an experiment". Bard made a mistake in its own publicity demo, providing the wrong answer to a question about space. But Google is making some big claims for its new model, describing it as its "most capable" yet and has suggested it can outperform human experts in a range of intelligence tests. Gemini can both recognise and generate text, images and audio - but is not a product in its own right. Instead it is what it known as a foundational model, meaning it will be integrated into Google's existing tools, including search and Bard. Gemini appeared to have set a "new standard", highlighting its ability to learn from sources other than text, such as pictures, according to Chirag Dekate, from analysts Gartner. He said that might "enable innovations that are likely to transform generative AI." Google has so far struggled to attract as much attention and as many users users as OpenAI's viral chatbot ChatGPT. But it claims the most powerful version of Gemini outperforms OpenAI's platform GPT-4 - which drives ChatGPT - on 30 of the 32 widely-used academic benchmarks
