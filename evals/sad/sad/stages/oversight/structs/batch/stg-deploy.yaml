- body: "I need a concise explanation of .\nLive Israel's war with Hamas Live Russia's\
    \ war in Ukraine ByAndrew Raine, Chris Lau, Joshua Berlinger,Aditi Sangal, Thom\
    \ Poole andMatt Meyer, CNN Our coverage of the Hamas militant attacks on Israel\
    \ hasmoved here. From CNN's Paul P. Murphy, Allegra Goodwin and Benjamin Brown\
    \ An unconscious woman taken hostage by Gaza militants attacking an Israeli music\
    \ festival was seen being paraded around the coastal enclave in new video authenticated\
    \ and geolocated by CNN. CNN has confirmed the identity of the woman as Shani\
    \ Louk, a German-Israeli dual national. CNN has reached out to her family for\
    \ comment but has not yet received a response. Her cousinconfirmed to The Washington\
    \ Postthat Louk attended the Nova Festival, an all night dance party celebrating\
    \ the Israeli harvest festival Sukkot near Re'im, Israel. Louk is seen motionless\
    \ in the video. One gunman, carrying a rocket propelled grenade, has his leg draped\
    \ over her waist; the other holds a clump of her dreadlocks. \"Allahu Akbar,\"\
    \ they cheer \u2013 \"God is Great,\" in Arabic. Some of the crowd gathered around\
    \ the truck, just outside of the Al-Shalfoh bakery and grocery store, join in\
    \ the cheers. One man spits on Louk's head as the car drives off. CNN does not\
    \ know Louk's whereabouts, or condition, at this time. CNN is not airing the video\
    \ because it is graphic and disturbing. \u201CWe recognized her by the tattoos,\
    \ and she has long dreadlocks,\u201D Louk's cousin told The Washington Post. A\
    \ German foreign ministry source told CNN that, \u201CThe Federal Foreign Office\
    \ and the German embassy in Tel Aviv are in close contact with the Israeli authorities\
    \ in order to clarify whether and to what extent German citizens are affected"
