- body: "Please check the following text for typos:\n\nCALGARY, Alberta, Dec.  06,\
    \ 2023  (GLOBE NEWSWIRE) -- Pulse Seismic Inc. (TSX:PSD) (OTCQX:PLSDF) (\u201C\
    Pulse\u201D or the \u201CCompany\u201D) is pleased to announce the signing of\
    \ an $8.5 million seismic data licensing sales agreement. In addition, the Company\
    \ has declared a special dividend of $0.20 per common share.\nThe licensing agreement\
    \ announced today has two components, with the first tranche comprising $5.2 million\
    \ of data being recognized as revenue today, bringing year to date revenue to\
    \ $37.3 million. The second tranche, comprising $3.3 million of data, will be\
    \ delivered to the client in January 2024 at which time the related revenue will\
    \ be recognized.\nThe special dividend, totaling approximately $10.5 million based\
    \ on Pulse\u2019s 52,637,463 common shares outstanding as of December 6, 2023,\
    \ will be paid on January 8, 2024, to shareholders of record on December 21, 2023.\
    \ This dividend is designated as an eligible dividend for Canadian income tax\
    \ purposes. For non-resident shareholders, Pulse\u2019s dividends are subject\
    \ to Canadian withholding tax.\n\u201CThis is the fourth material data licensing\
    \ agreement that Pulse has announced in 2023 and signifies a momentous improvement\
    \ over 2022 sales levels,\u201D stated Neal Coleman, the Company\u2019s President\
    \ and CEO. \u201CSubsurface data is an extremely valuable risk mitigation tool\
    \ utilized in the energy industry, and we are certainly pleased to contribute\
    \ to our clients\u2019 efforts to maximize the value of their projects, while\
    \ also increasing returns on our asset, the largest licensable Canadian seismic\
    \ data library,\u201D Coleman continued"
