- body: "Give me a summary of this article:\nSeven children among dozens dead after\
    \ blaze tears through building in South Africa\u2019s largest city At least 73\
    \ people, including seven children, have died in a fire in a multi-storey building\
    \ in the centre of Johannesburg, South Africa\u2019s biggest city, emergency services\
    \ have said. In one of the country\u2019s worst such tragedies in living memory,\
    \ emergency management services said a further 43 people had been injured in the\
    \ blaze, which broke out early on Thursday. People had been evacuated from the\
    \ building, and an emergency services spokesperson said a search and recovery\
    \ operation was under way. It was likely the death toll would rise, Robert Mulaudzi\
    \ said, and it was not immediately clear what caused the blaze. As of midday on\
    \ Thursday, authorities had yet to count the casualties on the top two floors\
    \ of the five-storey building. \u201COver 20 years in the service, I\u2019ve never\
    \ come across something like this,\u201D Mulaudzi said. There was an \u201Cinformal\
    \ settlement\u201D inside the building, Mulaudzi said. \u201CSo there [are] a\
    \ lot of informal structures inside the building. There is a lot of debris that\
    \ we have to remove.\u201D Omar Arafat, a resident of the building, said he was\
    \ woken up at about 1am by loud bangs and screams of \u201Cfire, fire\u201D. He\
    \ rushed for the building\u2019s front door, but his path was blocked by flames.\
    \ With no other avenue of escape, he broke a window in his third-storey room and\
    \ jumped. He said he did not remember anything else. \u201CI was out for three\
    \ hours,\u201D the Malawian national said"
