- body: "Bullet points summary of:\nBonn and Geneva (Copernicus and WMO) - According\
    \ to ERA5 data from the EU-funded Copernicus Climate Change Service (C3S), the\
    \ first three weeks of July have been the warmest three-week period on record\
    \ and the month is on track to be the hottest July and the hottest month on record.\
    \ These temperatures have been related to heatwaves in large parts of North America,\
    \ Asia and Europe, which along with wildfires in countries including Canada and\
    \ Greece, have had major impacts on people\u2019s health, the environment and\
    \ economies. \xAB We don\u2019t have to wait for the end of the month to know\
    \ this. Short of a mini-Ice Age over the next days, July 2023 will shatter records\
    \ across the board, \xBB said United Nations Secretary-General Ant\xF3nio Guterres.\
    \ \xAB According to the data released today, July has already seen the hottest\
    \ three-week period ever recorded; the three hottest days on record; and the highest-ever\
    \ ocean temperatures for this time of year, \xBB Mr Guterres told journalists\
    \ at UN headquarters in New York. \xAB For vast parts of North America, Asia,\
    \ Africa and Europe \u2013 it is a cruel summer. For the entire planet, it is\
    \ a disaster. And for scientists, it is unequivocal \u2013 humans are to blame.\
    \ All this is entirely consistent with predictions and repeated warnings. The\
    \ only surprise is the speed of the change, \xBB said Mr Guterres. On July 6,\
    \ the daily average global mean surface air temperature surpassed the record set\
    \ in August 2016, making it the hottest day on record, with July 5 and July 7\
    \ shortly behind"
