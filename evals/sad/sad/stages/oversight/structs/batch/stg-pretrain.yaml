    Carbon Dioxide for Obstetric Pneumoperitoneum
    To the Editor-Dr. Rosen' provides a comprehensive review of anes thesia for the pregnant surgical patient, including some recommendations for the increasingly frequent procedure of laparoscopy during pregnancy. One of his recommendations is the use of nitrous oxide in place of carbon dioxide for establishing pneumoperitoneum. This is a major departure from current clinical practice and deserves better supporting evidence than any provided in Dr During pregnancy, special care should be taken to keep the intraabdominal pressure low (less than 15 mmHg) and maintain maternal normocapnia. Using these precautions, for several important reasons, including noncombustibility and easy, rapid elimination, carbon dioxide is the gas of choice for creating pneumoperitoneum. In Reply:--I appreciate the thoughtful comments expressed by Drs. Pennington and Stein about the Clinical Concepts and Commentary article concerning management of surgery for the pregnant patient. Because of imposed limitations on the number of references, the only referenced article about laparoscopy and pregnancy was from the Swedish Health Registry;' however, mention was made in my article about "several case reports of success in the late seco
