- body: |-
    Abstract
    V entriculoperitoneal (VP) shunts are known to perforate the gastrointestinal (GI) tract, the abdominal wall, and the bladder. The incidence of VP shunts perforating the GI tract has been reported to be between 0.1% and 0.7%. 7, 25, 27, 32 If a shunt perforates the GI tract, it migrates most often caudally thereafter to protrude through the anal orifice, but has been reported to migrate upward and protrude through the oral cavity. 2, 5, 6, 9, 15, 21, 23, 27, 29 More than 50% of VP shunt protrusions occur in patients less than 10 years of age.
    Abstract
    Several factors have been postulated to increase the risk of GI perforations, including the thin bowel wall of children, stiff shunt catheters, chronic irritation by the shunt, silicone allergy, and use of abdominal trocars. 3, 4, 14, 23, 26, 31 Forceful repeated retching and vomiting may cause a catheter that perforated the GI tract to migrate proximally to the oral cavity.
    Abstract
    The purposes of this study were 3-fold: 1) to evaluate the frequency with which children presented to our hospital with VP shunt perforations of the GI tract; 2) to determine the type of shunts that caused the perforations; and 3) to compare the stiffness of the perforating catheter brand with the stiffness of catheters from other manufacturers. It is particularly important that shunts not be prone to perforating tissues when they are used in developing countries, where recognition and treatment of shunt complications are considerably more difficult. Our hypotheses of this study were that Chhabra shunts are associated with GI perforations more frequently than shunts from o
