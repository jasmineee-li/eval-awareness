- body: "Itsukaichi Kaid\u014D\n\nItsukaichi Kaid\u014D (\u4E94\u65E5\u5E02\u8857\u9053\
    ) is the historic and current main road between former Itsukaichi (now Akiruno)\
    \ and Suginami in Tokyo's central suburbs. It generally follows the same road\
    \ as the Suginami Akiruno Line along Tokyo Metropolitan Road Route 7 (ja).\n\n\
    Overview\n\nAfter Tokugawa Ieyasu entered Edo, he developed Itsukaichi Kaid\u014D\
    \ for the purpose of transporting timber and charcoal from Itukaichi (now Akiruno)\
    \ and Hinohara. Initially, the road was called \"Ina Road\", after Ina, a settlement\
    \ not far east of Itsukaichi. Ina was the source of stones used for restoring\
    \ Edo Castle and the road developed for transport between these two places. After\
    \ the restoration of Edo Castle was finished, charcoal became the main product\
    \ transported and Itsukaichi grew to become more significant than Ina.\n\nAs land\
    \ was opened up on the Musashino Plateau, the road between the Tama district and\
    \ Edo developed as one highway."
