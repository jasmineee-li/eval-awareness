- body: "Title: SSIS DTSX package losing data in a SQL Server Agent job\nTags: sql;sql-server-2005;variables;ssis;sql-server-agent\n\
    Question: I have an SSIS job which takes files from an input FTP directory and\
    \ unzips the contents into a temp directory for further processing. I'm using\
    \ a For-Each directory loop over the input FTP directory, and within that there\
    \ is a call to Winzip. The argument to the command-line call is configured with\
    \ the filename of the input file and the name of the temp directory using the\
    \ SSIS Expression builder. It looks like this in Expression Builder:\n-e  \" +\
    \  @[User75b5:f2c1:f5d7:b954:8dc3:cee9:baf:a8c0InputFolder] + \"\\\\\" + @[User75b5:f2c1:f5d7:b954:8dc3:cee9:baf:a8c0urrentInputFileName]\
    \ + \"  \" + @[User75b5:f2c1:f5d7:b954:8dc3:cee9:baf:a8c0TempFolder]\nNow, this\
    \ all works fine and dandy when I run it locally from VS2005 and access the relevant\
    \ files over the network. But when I deploy to the application server, I get nothing\
    \ out of the other side; it just hangs there. The variables seem to be being lost\
    \ along the way.\nAny ideas anyone? Has anyone seen similar behaviour from an\
    \ SSIS package?\nComment: Wow... thanks Siva for the detailed answer.\nturns out\
    \ you were both right, to an extent. Running on the server used a different set\
    \ of permissions, and the folder on the server had security settings out of whack.\n\
    \nHere is the accepted answer: When you run SSIS package in Business Intelligence\
    \ Development Studio (BIDS), it executes under your credentials and you might\
    \ have full permissions to the folder where the files are extracted to. When you\
    \ schedule the package to run in SQL Server Agent, the package will run under\
    \ SQL Agent Service Account, the "
