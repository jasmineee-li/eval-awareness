- body: "Issue title: gRPC client serialization bug breaks Decision task definition\n\
    \ Issue body: #Problem\r\nProtobuf in gRPC client serialization changes null values\
    \ to an empty string. The server code doesn't handle such cases correctly sometimes.\r\
    \n\r\n#Details\r\nIf we compose a worflow definition with Decision task in java\
    \ gRPC client, for example by doing\r\n```\r\nObjectMapper objectMapper = new\
    \ JsonMapperProvider().get();\r\nInputStream inputStream = ClassLoader.getSystemResourceAsStream(fileName);\r\
    \nWorkflowDef.class  def = objectMapper.readValue(inputStream, WorkflowDef.class);\r\
    \nmetadataClient.registerWorkflowDef(def);\r\n```\r\nfrom a stream with\r\n```\r\
    \n{\r\n  \"name\" : \"DecisionWorkflow\",\r\n  \"description\" : \"DecisionWorkflow\"\
    ,\r\n  \"version\" : 1,\r\n  \"tasks\" : [ {\r\n    \"name\" : \"decisionTask\"\
    ,\r\n    \"taskReferenceName\" : \"decisionTask\",\r\n    \"inputParameters\"\
    \ : {\r\n      \"case\" : \"${workflow.input.case}\"\r\n    },\r\n    \"type\"\
    \ : \"DECISION\",\r\n    \"caseValueParam\" : \"case\",\r\n    \"decisionCases\"\
    \ : {\r\n      \"c\" : [...]\r\n    },\r\n    \"defaultCase\" : [...],\r\n  }],\r\
    \n  \"schemaVersion\" : 2,\r\n  \"restartable\" : true,\r\n}\r\n```\r\n\r\nThe\
    \ WorkflowDef after serializing into Protobuf producing an entity\r\nWorkflowTaskPb$QorkflowTask\
    \ that has an empty string in a field \"caseExpression\" which is absent (null)\
    \ in the original java POJO. After deserialization on the server-side, it's still\
    \ an empty string instead of null. It gets processed incorrectly in https://github.com/Netflix/conductor/blob/master/core/src/main/java/com/netflix/conductor/core/execution/mapper/DecisionTaskMapper.java#L125\
    \ which has only a null check and if ```caseExpression``` is not null we ignore\
    \ ```caseValueParam``` completely. W"
