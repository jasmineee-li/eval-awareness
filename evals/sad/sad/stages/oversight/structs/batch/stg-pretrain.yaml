- body: "Title of Invention: Drain diverted dirty water and continuously circulated\
    \ clean water system\nAbstract: According to embodiments of the present disclosure\
    \ is a water delivery system that continuously flows and recirculates clean water,\
    \ diverting only water that has touched a user's hands. No sensing is required\
    \ to activate the water flow and the actions of the user effectively divert the\
    \ dirty water to a drain. The water delivery system comprises a clean water outlet,\
    \ a clean water inlet, a dirty water drain, and a circulation pump. A stream of\
    \ water continuously flows from the outlet and is received by the water inlet\
    \ if the stream is uninterrupted. If the stream is disturbed, such as by the hand\
    \ washing activities of the user, the stream is diverted from the inlet and instead\
