- body: "Title: Copenhagen Central Library threw away ~4600 kg (10,141 lb) of books\
    \ last week alone\nThe text below was posted in an online community called DumpsterDiving\
    \ in the year 2019:\n\nYou guys, I'm pissed. I saw librarians dumping stacks on\
    \ stacks of all kinds of beautiful old and new books out in a giant dumpster,\
    \ so naturally I went a-divin. Copenhagen allows dumpster diving for food-- but\
    \ apparently, not for books!\n\nI tried to rescue some books from the trash (no,\
    \ they are not being sold or donated or even recycled) but got screamed at by\
    \ a librarian and told to leave.\n\nA sweet skinny intern told me he also thinks\
    \ this is fucked up and that his employers are throwing away rare books that might\
    \ have few copies. I asked if I could gather some for donation, but he said I\
    \ wasn't allowed. What the actual fuck??!!!\n\nI don't know why I'm posting here\
    \ other than just wanting to bemoan fucked legalistic ppl who enforce the rules\
    \ against such a strong moral imperative like saving books.\n\nHonestly, wouldn't\
    \ it at least be cost-neutral for them to arrange shipping the books out to prisons\
    \ instead of to the fucking landfill? \n\nPs. If there are any Danes who frequent\
    \ this subreddit let's figure out if we can do anything about this tragedy!\n\n\
    Pps. Apparently this is part of a major, weeks-long grand throwing away of books\
    \ and "
