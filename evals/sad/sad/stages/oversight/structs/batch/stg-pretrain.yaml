- body: "Yutian County, Xinjiang\n\nYutian County, also transliterated from Uyghur\
    \ as Keriya County (\u0643\u06D0\u0631\u0649\u064A\u06D5 \u0646\u0627\u06BE\u0649\
    \u064A\u0649\u0633\u0649; ), is a county in Hotan Prefecture, Xinjiang Uyghur\
    \ Autonomous Region, China. It is based at the Keriya Town, and is separate from\
    \ Hotan County, which is another county in the same prefecture. The Yutian County\
    \ has an area of 39023 km2. According to the 2002 census, it has a population\
    \ of 220,000. The county is bounded on the north by Aksu Prefecture, on the east\
    \ by Minfeng/Niya County, on the west by Qira County and on the south by the Rutog\
    \ and Gertse counties of the Tibet Autonomous Region.\n\nName\n\nThe county derives\
    \ its Chinese name from the Kingdom of Khotan. The name was written as '\u4E8E\
    \u95D0' at that time. This was later changed to '\u7389\u7530' (literally, Jade\
    \ Field) following the adoption of Simplified Chinese and eventually to '\u4E8E\
    \u7530' in 1959. The three names have a similar pronunciation in Mandarin Chinese.\n\
    \nThe original name of Hotan/Khotan is Gosthana/Gausthana/Gaustana, Gu-dana, Godana\
    \ or Godaniya, the name used in Sanskrit cosmological texts and also how the area\
    \ is historically referred to as.\n\nGosthana/Gausthana/Gaustana/Godana/Godaniya\
    \ translates to \"land of cows\" in Sanskrit. The pronunciation changed over the\
    \ years to Kho-ta"
