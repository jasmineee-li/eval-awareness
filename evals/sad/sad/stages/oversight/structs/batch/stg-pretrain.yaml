    United States Court of Appeals, Fifth Circuit.
    Jan. 2, 1975, Rehearing and Rehearing En Banc Denied Feb. 6, 1975.

    Daniel S. Pearson, Miami, Fla., for defendant-appellant.
    John W. Stokes, Jr., U.S. Atty., John Milton Turner, Jr., Asst. U.S. Atty., Atlanta, Ga., for plaintiff-appellee.
    Before BROWN, Chief Judge, and THORNBERRY and AINSWORTH, circuit judges.
    AINSWORTH, Circuit Judge:


    1
    Appellant, Robert Anthony James, was convicted on a four-count indictment for violations of the Mann Act, 18 U.S.C. 2421, 2422, which proscribes knowingly inducing, enticing, and coercing women to travel in interstate commerce for the purpose of engaging in prostitution.  In this appeal appellant alleges his counsel was ineffective because of a conflict of interest allegedly resulting from counsel's prior representation of a Government witness; that the court erred in not giving certain instructions; and that there was insufficient evidence to sustain the conviction on Count II of the indictment.  A review of these alleged errors reveals no basis for reversal, and we therefore affirm.


