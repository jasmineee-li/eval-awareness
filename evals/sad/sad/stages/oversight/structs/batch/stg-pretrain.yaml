    \ through that LC's interaction with a confining substrate is termed anchoring\_\
    @RefWorks:2. In the absence of defects and applied fields, substrate anchoring\
    \ is the main determinant of the director profile in a sandwich geometry LC cell;\
    \ the director profile in such a cell is set through 0 of the orientational elastic\
    \ energy, subject to each wall's polar and azimuthal anchoring constraints. At\
    \ a continuum level, this elastic energy is most commonly"
