- body: 'East Providence is a city in Providence County, Rhode Island, it is known
    as the Gateway to the East Bay. The area is predominantly residential, with elegant
    waterfront property and numerous apartment complexes. East Providence is not the
    eastern portion of the city of Providence. The eastern portion of Providence is
    known as "The East Side." This city began as community of settlers comprised of
    Puritans from Boston and Pilgrims from Plymouth as part of Rehoboth, Massachusetts.
    The western portion became the town of Seekonk on February 26, 1812. In 1862,
    part of Seekonk was annexed to Rhode Island and the residents renamed the town
    East Providence. Several houses built before the Revolution are still standing
    today. East Providence is located between the urban center of Rhode Island and
    rural southern Massachusetts. Demographically, there is a high percentage of Portuguese
    heritage. This community is still growing because of its central location on an
