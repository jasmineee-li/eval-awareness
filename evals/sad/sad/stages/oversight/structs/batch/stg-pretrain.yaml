- body: "Title of Invention: D-Q Control System and Method for Controlling a Switched\
    \ Reluctance Motor\nAbstract: \nA D-Q or rotating reference frame control system\
    \ for a switched reluctance motor (SRM) provides a negativity removal module and\
    \ a non-linear model module. As such, the control system utilizes control inputs\
    \ fq and fd, which are converted into the ABC domain as electrical current functions\
    \ f\u2032ix with negative values. The negativity removal module is configured\
    \ to share the torque portion of the negative values of the electrical current\
    \ functions f\u2032ix for each of the three phases of the SRM motor to remove\
    \ the negative values. The non-linear module corrects the non-linearity of the\
    \ SRM to smooth the torque that is output. The control system also utilizes a\
    \ phase advancing module, which outputs fd for achieving a wide range of operating\
    \ speeds.\n\nDetailed Description: \n\nCROSS-REFERENCE TO RELATED APPLICATION\n\
    This application claims the benefit of U.S. Provisional Application No. 61/927,253\
    \ filed on Jan. 14, 2014, the content of which is incorporated herein by reference.\n\
    \n\nTECHNICAL FIELD\nGenerally, the present invention relates to switched reluctance\
    \ motors (SRM). Particularly, the present invention relates to control systems\
    \ for SRMs. More particu"
