- body: "I N T R O D U C T I O N\nNicotinic transmission plays a key role during the\
    \ development of mammalian and avian visual systems. Cholinergic nerve fibers\
    \ and nicotinic acetylcholine receptors (nAChRs) are present throughout the vertebrate\
    \ visual nervous system, including the retina, lateral geniculate nucleus (LGN),\
    \ and certain layers of the visual cortex. Nicotinic receptors mediate the initiation\
    \ of spontaneous bursts of wave-like activity in the developing retina (Feller\
    \ et al. 1996; Sernagor et al. 2000) . In mice lacking the \u24242 nAChR subunit,\
    \ these retinal waves are absent, and the pattern of innervation of the LGN by\
    \ retinal ganglion cells is abnormal (McLaughlin et al. 2003; MuirRobinson et\
    \ al. 2002; Rossi et al. 2001) . In ferret visual cortex, fast, evoked nicotinic\
    \ transmission is observed before and during innervation by thalamic afferents\
    \ (Roerig et al. 1997) .\nI N T R O D U C T I O N\nThe chick ventral LGN (LGNv)\
    \ contains a high density of cholinergic nerve fibers (Sorenson et al. 1989 )\
    \ and at least three subtypes of nAChRs that can be differentially labeled by\
    \ radioactive nicotine, \u2423-bungarotoxin (\u2423-BgTx), and -BgTx (Sorenson\
    \ and Chiappinelli 1992) . Functional studies have shown that exogenous nicotinic\
    \ agonists can increase the frequency of glutamatergic spontaneous postsynaptic\
    \ currents (SPSCs"
