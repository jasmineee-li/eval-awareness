    When I was in the sixth grade, I got into a bensonnicole@example.net.
    It wasn't the first time I'd been in a fight, but it was the first time one bensonnicole@example.net.
    It was with a boy who was about a foot taller than me, who was physically stronger than me and who'd been taunting me for weeks.
    One day in PE, he stepped on my shoe and refused to apologize.
    So, filled with anger, I grabbed him and I threw him to the ground.
    I'd had some previous judo training.
    (Laughter) Our fight lasted less than two minutes, but it was a perfect reflection of the hurricane that was building inside of me as a young survivor of sexual assault and as a girl who was grappling with abandonment and exposure to violence in other spaces in my life.
    I was fighting him, but I was also fighting the men and boys that had assaulted my body and the culture that told me I had to be silent about it.
    A teacher broke up the fight and my principal called me in her office.
    But she didn't say, "Monique, what's wrong with you?"
    She gave me a moment to collect my breath and asked, "What happened?"
    The educators working with me led with empathy.
    They knew me.
    They knew I loved to read, they knew I loved to draw, they knew I adored Prince.
    And they used that information to help me understand why my actions, and those of my classmate, were disruptive to the learning community they were leading.
    They didn't place me on suspension; they didn't call the police.
    My fight didn't keep me from going to school the next day.
    It didn't keep me from graduating; it didn't keep me from teaching.
    But unfortunately, that
