- body: ' Introduction to forms in Angular Handling user input with forms is the cornerstone
    of many common applications. Applications use forms to enable users to log in,
    to update a profile, to enter sensitive information, and to perform many other
    data-entry tasks. Angular provides two different approaches to handling user input
    through forms: reactive and template-driven. Both capture user input events from
    the view, validate the user input, create a form model and data model to update,
    and provide a way to track changes. This guide provides information to help you
    decide which type of form works best for your situation. It introduces the common
    building blocks used by both approaches. It also summarizes the key differences
    between the two approaches, and demonstrates those differences in the context
    of setup, data flow, and testing. Prerequisites This guide assumes that you have
    a basic understanding of the following.   TypeScript and HTML5 programming.   Angular
    app-design fundamentals, as described in Angular Concepts.   The basics of Angular
    template syntax.   Choosing an approach Reactive forms and template-driven forms
    process and manage form data differently. Each approach offers different advantages.   Reactive
    forms provide direct, explicit access to the underlying forms object model. Compared
    to template-driven forms, they are more robust: they''re more scalable, reusable,
    and testable. If forms are a key part of your application, or you''re already
    using reactive patterns for building your application, use reactive forms.   Template-driven
    forms rely on directives in the template to create and manipulate the underlyin'
