    \ for sure, as we would use a mod that we would make. \n\nHere are some of the\
    \ things that we would do with this league\n\n* 8-16 teams of 5 players each,\
    \ in a season style tournament that would play games on a set time, most of them\
    \ on a stream that would be casted.\n\n* Active balancing, we would work to patch\
    \ the mod as much as possible. Here are some changes we were planning to add to\
    \ help diversify the game\n\n1. Removal of Juggernaut and Stopping power, to allow\
    \ more diversity in the 2nd Perk slot, those two feel very over used. We would\
    \ a lot Stopping power damage to every weapon (balancing would have to be looked\
    \ over) in the absence of SP so that sniping isn't completely unviable.\n\n2.\
    \ Buffing many under used weapons and sidearms. We'll use the Uzi as an example.\
    \ Our plans were to decrease spray of the Uzi, make it more accurate, lower recoil,\
    \ and give it a little more range.\n\n* Each week, 1 team would play two 'series'.\
    \ Each team would play 3 games of our selected game types on that week's maps.\
    \ Currently we had planned game modes of Sabotage, SnD, and HQ (HQ is the most\
    \ tentative). Who ever won the series gets the win for that week. So lets say\
    \ a team plays 22 series in a season, they would end up playing 66 games in total.\n\
    \n* Stats would be tracked and recorded on our website, Kil"
