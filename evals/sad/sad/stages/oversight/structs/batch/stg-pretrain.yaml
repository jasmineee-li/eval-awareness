- body: "Tony Bianchi\n\nTony Bianchi (5 April 1952 \u2013 2 July 2017) was a prize-winning\
    \ novelist, poet, short-story writer and critic, writing in both Welsh and English.\n\
    \nEarly life\n\nTony Bianchi was born in North Shields, near Newcastle-upon-Tyne.\
    \ His father was a policeman of Italian ancestry. He attended a Catholic school\
    \ on Tyneside, then studied English & Philosophy at St David's University College\
    \ in Lampeter, Wales.\n\nBianchi obtained a doctoral degree with a thesis on Samuel\
    \ Beckett. While studying in Wales, he met his future wife, Diana, who was an\
    \ activist Welsh speaker, and who instilled a passion for the language in him.\
    \ They had two daughters, Rhiannon and Heledd, named after early Welsh literary\
    \ figures.\n\nCareer\n\nBianchi's first job was as a teacher of English in Flintshire\
    \ and Aberystwyth. He then became Literature Officer (and subsequently Literature\
    \ Director) at the Welsh Arts Council in Cardiff - an organisation that provided\
    \ him with material for his first novel Esgyrn Bach. Bianchi's literary life took\
    \ off after his retirement from the Arts Council in 2002. He became a prolific\
    \ novelist as well as a skillful poet, well-versed in the intricacies of the strict\
    \ metres of Welsh poetry and winning numerous prizes and plaudits. He lived in\
    \ Cardiff with his partner Ruth until his death in 2017 aged 65. He was an avid\
    \ supporter of Newcastle United; an excellent pianist; a frequent (bilingual)\
    \ contributor to debates in the Conway pub about be"
