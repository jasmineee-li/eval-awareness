- body: "Issue title: Adding extra fields to insert\n Issue body: Hi, Nice package.\r\
    \nPlease how can I add extra fields to the insert object e.g/ an `uploadedAt `\
    \ field. \r\nI've tried collection hooks but it returns an error \r\nThanks\n\
    \ Comments: \n Comment 0: @kenshinman \r\n\r\ntry to attach your custom field\
    \ inside meta\r\n\r\n```\r\nconst upload = this.FilesCollection.insert({\r\n \
    \         file: file,\r\n          streams: 'dynamic',\r\n          chunkSize:\
    \ 'dynamic',\r\n          meta: {\r\n            _id: Random.id(),\r\n       \
    \     mycustomfield: 'blah blah blah'\r\n          }\r\n        }, false)\r\n\
    ```\n Comment 1: Hi @kenshinman ,\r\n\r\nSolution suggested by @kenshinman is\
    \ correct.\r\n\r\n 1. For security reasons on Client side you able to extend only\
    \ `meta` object\r\n 2. On server - to extend fileObj use `onAfterUpload` hook\r\
    \n 3. collection hooks may not work as *FilesCollection* is not equals to Mongo\
    \ Collection\r\n 4. To operate on Mongo Collection level - use sub-property `collection`\
    \ of *FilesCollection* instance (`FilesCollection#collection`) \n Comment 2: @dr-dimitru\
    \ Thanks"
