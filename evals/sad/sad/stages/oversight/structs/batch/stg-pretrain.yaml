- body: "Title: Temperature went down after 6 hours?\nThe text below was posted in\
    \ an online community called biggreenegg in the year 2020:\n\nNoob question here.\
    \ Did my first brisket on my new egg (I've had it for a week)  on Sunday. 5lb\
    \ brisket cooked to 210f after 6.5 hours at around 260 - 280. Turned out well\
    \ but not much of a bark.\n\nA funny thing happened at about 6 hours. The egg\
    \ temp went down to about 200. I opened the vents more to see if I could get the\
    \ temp up (I didn't need it at that stage, just curious) and it wouldn't move.\
    \ I assumed that maybe I ran out of charcoal but when I looked the next day, there\
    \ was loads left. I assume the holes on the fire grate were blocked. \n\nSo my\
    \ question is, if I am doing a longer cook do I need to clean some of the ash?\
    \ How can I avoid this if I need it to go a few more hours?"
