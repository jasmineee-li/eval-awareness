- body: '--- abstract: | We present the optical and X-ray properties of 68 galaxy
    clusters selected via the Sunyaev-Zel''dovich Effect at 148GHz by the Atacama
    Cosmology Telescope (ACT). Our sample, from an area of 504 square degrees centered
    on the celestial equator, is divided into two regions. The main region uses 270
    square degrees of the ACT survey that overlaps with the co-added $ugriz$ imaging
    from the Sloan Digital Sky Survey (SDSS) over Stripe 82 plus additional near-infrared
    pointed observations with the Apache Point Observatory 3.5-meter telescope. We
    confirm a total of 49 clusters to $z\approx1.3$, of which 22 (all at $z>0.55$)
    are new discoveries. For the second region the regular-depth SDSS imaging allows
    us to confirm 19 more clusters up to $z\approx0.7$, of which 10 systems are new.
    We present the optical richness, photometric redshifts, and separation between
    the SZ position and the brightest cluster galaxy (BCG). We find no significant
    offset between the cluster SZ centroid and BCG location and a weak correlation
    between optical richness and SZ-derived mass. We also present X-ray fluxes and
    luminosities from the All Sky Survey which confirm that this is a massive sample.
    One of the newly discovered clusters, at $z=1.1$ (photometric), has an integrated
    X-ray temperature of $kT_X=7.9\pm1.0$ keV and combined mass of $M_{200a} = 8.2_{-2.5}^{+3.3}\times10^{14}\,h_{70}^{-1}M_\odot$
    placing it among the most massive and X-ray-hot clusters known at redshifts beyond
    $z=1$. We also highlight the optically-rich cluster 2327 (RCS2 2327) at $z=0.705$
    (spectroscopic) as the most significant detecti'
