    In view of reports of the histamine-releasing potential of atracurium (Basta et al., 1983; Scott et al., 1985) , and of cutaneous reactions associated with its use (Coleman, Hunter and Hunt, 1983; Nightinghale and Bush, 1983; Lavery and Mirakhur, 1984; Mirakhur et al., 1985) , the anaesthetic records of 1200 patients to whom atracurium had been given were examined in an attempt to assess the clinical significance of these findings.
    PATIENTS AND METHODS
    Atracurium was given by the author on 1200 occasions to 1123 patients, aged between 4 and 91 yr, undergoing elective or emergency operations requiring the use of a neuromuscular blocking drug as part of the anaesthetic regimen. The study began 21 months before the issue of a product licence in the U.K. (Rowlands, 1983) .
    PATIENTS AND METHODS
    Three hundred and twelve patients received no premedication, 722 were given diazepam 5-10 mg by mouth, 78 received lorazepam 2.5-5 mg by mouth; the remainder received other premedicants. Anaesthesia was induced with methohexitone 1.1-1.7 mg kg" 1 i.v. (to which lignocaine had been added to reduce the frequency of pain during the injection (Rowlands, 1969) ) given over 20-85 s. Atracurium 0.3-0.6 mg kg" 1 was then given through the same 27-gauge (12xO.4-mm) needle over 5-10 s.
    PATIENTS AND METHODS
    The drugs were injected to a vein on the dorsum of the hand in approximately three-quarters of the patients, and to a vein in the antecubital fossa in most of the remainder.
    PATIENTS AND METHODS
    In 62 patients droperidol 5-10 mg and fentanyl 0.1-0.2 mg were administered i.
