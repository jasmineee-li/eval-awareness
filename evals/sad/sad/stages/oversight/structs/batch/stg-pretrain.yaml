    ORDER

    1
    The appellee's petition for rehearing of this case asked in part that we reconsider our reversal of the award of damages for parental loss of services.  We stated in our opinion filed May 7, 1987 that there was no evidence in the record to support that award for any of the appellees other than the Stigalls.  Bergen v. F/V/St. Patrick, 816 F.2d 1345, 1350 (9th Cir.1987).  We said:


