- body: "---\nabstract: |\n    Using the isospin analysis, the fact that penguin is\
    \ pure $\\Delta I=1/2$ transition, the unitarity for tree graph and $C$-invariance\
    \ of strong interactions, it is shown that $\\delta _{t}=0=\\tilde{\\delta}_{t},$\
    \ $%\n    r_{-0}=tr_{0-},\\delta _{-0}-\\delta _{0-}=\\pm \\pi ,$ $2tr_{f}r_{\\\
    bar{f}}\\cos\n    (\\delta _{f}-\\delta _{\\bar{f}})=(r_{f}^{2}+t^{2}r_{\\bar{f}}^{2})-r_{-0}^{2},$\
    \ where $\\delta $'$s$ are final state phases and $r$'$s$ are penguin to tree\
    \ ratios defined in the text.\n\n    Using the factorization for tree graph as\
    \ input and the experimental data, we have obtained the following bounds on $r_{f},r_{\\\
    bar{f}},\\delta _{f}$ and $\\delta _{\\bar{f}}:0.11\\leq r_{f}\\leq 0.21,0.18\\\
    leq r_{\\bar{f}}\\leq 0.30;$ $%\n    11^{\\circ }\\leq \\delta _{f}\\leq 57^{\\\
    circ },23^{\\circ }\\leq \\delta _{\\bar{f}%\n    }\\leq 90^{\\circ }$ for the\
    \ case $z_{f,\\bar{f}}=\\cos \\alpha \\cos \\delta _{f,%\n    \\bar{f}}<0$. For\
    \ $z_{f}<0$ and $z_{\\bar{f}}>0,$ we obtain the following bounds for $r_{\\bar{f}}$\
    \ and $\\delta _{\\bar{f}}:0.14\\leq r_{\\bar{f}}\\leq\n    0.46;$ $90^{\\circ\
    \ }\\leq \\delta _{\\bar{f}}\\leq 170^{\\circ }$. From experimental data, for\
    \ the decays $B^{-}\\rightarrow \\rho ^{-}\\pi ^{0}(\\rho\n    ^{0}\\pi ^{-})$\
    \ we get $\\epsilon _{-0}=0.28\\pm 0.10,\\epsilon _{0-}=0.51\\pm\n    0.10,$ $\\\
    frac{A_{CP}^{-0}}{A_{CP}^{0-}}=-0.8\\pm 0.1$ i.e. $A_{CP}^{-0}$ and $%\n    A_{CP}^{0-}$\
    \ have opposite sign, where $1+\\epsilon _{0-},_{0-}=\\frac{\\left|\n    T^{-0,0-}+C^{0-,-0}\\\
    right| }{\\left| T^{-0,0-}\\right| }.$ In the naive quark model the above values\
    \ imply $a_{2}/a_{1}=0.39\\pm 0.14$ and $%\n    a_{2}/a_{1}=0.37\\pm 0.07$ consistent\
    \ with each other.\nauthor:\n- |\n    Fayyazuddin\\\n    National\_Centre for\
    \ Physics and Department of Physics\\\n"
