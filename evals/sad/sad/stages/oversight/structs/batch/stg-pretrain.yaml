    We do not invest in victims, we invest in survivors.
    And in ways both big and small, the narrative of the victim shapes the way we see women.
    You can't count what you don't see.
    And we don't invest in what's invisible to us.
    But this is the face of resilience.
    Six years ago, I started writing about women entrepreneurs during and after conflict.
    I set out to write a compelling economic story, one that had great characters, that no one else was telling, and one that I thought mattered.
    And that turned out to be women.
    I had left ABC news and a career I loved at the age of 30 for business school, a path I knew almost nothing about.
    None of the women I had grown up with in Maryland had graduated from college, let alone considered business school.
    But they had hustled to feed their kids and pay their rent.
    And I saw from a young age that having a decent job and earning a good living made the biggest difference for families who were struggling.
    So if you're going to talk about jobs, then you have to talk about entrepreneurs.
    And if you're talking about entrepreneurs in conflict and post-conflict settings, then you must talk about women, because they are the population you have left.
    Rwanda in the immediate aftermath of the genocide was 77 percent female.
