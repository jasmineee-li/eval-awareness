- body: 'Galiano Island lies to the northeast of Saltspring Island off the east coast
    of Vancouver Island. Galiano Island is the closest and most convenient to Vancouver
    (and the U.S. border) of all of the Southern Gulf Islands, and in most cases it
    is the first stop on the BC Ferries route to the islands, only 50 minutes. In
    the quiet season there are just two ferries a day from Tsawwassen, the mainland
    terminal near Vancouver, and in the busier summer months, there may be up to 4
    sailings a day. If traveling with a car, reservations are advisable and there
    is no additional charge for reserving on the Gulf Islands Route. If you want to,
    it is very feasible to leave your car behind on the mainland, and travel as a
    foot passenger to see Galiano. Galiano is the perfect island for "island hopping":visitors
    can stay on Galiano, and use BC Ferries (or a summer water taxi) for visits to
    other islands, returning to Galiano at the end of the day. Visitors can also travel
    via Victoria (Swartz Bay Ferry Terminal) on Vancouver Island. There are several
    sailings a day, ranging from direct 1 hour and 10 minute sailings, to multi-stop
    "island-hopper" ferries. These sailings are not reservable. Private charter boats
    are also available at the discretion and timing of the passengers which affords
    guests the convenience of their own time table as well as privacy. These are reservable
    and can fit parties of almost any size, though they are more expensive than taking
    BC ferries. There is an "airport" in Montague Harbour, for float plane service,
    including regular scheduled service from the dock near Vancouver International
    Airport, with a connecting shuttle and complimentary parking. Regularly scheduled
    service: Pacific Air +1-855-WeFlyBC (95'
