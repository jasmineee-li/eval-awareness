- body: |-
    Abstract
    Abstract. Background: Outcomes of pediatric mature B cell non-Hodgkin's lymphoma in resource-challenged countries are negatively affected by an increased rate of early and toxic deaths. Aim of this study is to assess the rate of acute mortality and define significant risk factors present in children with mature B cell non-Hodgkin's lymphoma. Methods: A retrospective analysis was done of patients with B cell non-Hodgkin's lymphoma from January 2012 till December 2016. Risk factors studied for acute mortality were malnutrition, stage, prior surgery with open laparotomy, lactate dehydrogenase levels, tumor lysis syndrome, sepsis, and fungal infection Results: A total of 233 patients were enrolled in the study. Eighty-five (36.4%) were below 15 th percentile weight for age. Treatment was started in 226 patients. Eighty-eight percent of children showed a 20% response after COP pre-phase. Tumor lysis syndrome was developed in 20.6% (n = 48) children and 42.9% (n = 100) patients had sepsis, 71/100 patients had culture-proven sepsis. 19.7% (n = 46) patients developed fungal infection. There was 19.7% (n = 46) acute mortality. The most common cause of death was sepsis (n = 22, 47.8%) followed by acute renal failure secondary to tumor lysis syndrome. On multivariate analysis, three independent variables found significant for early death are malnutrition, sepsis, and tumor lysis syndrome. Conclusion: Rate of acute mortality in mature B cell NHL is high in our set up and significant risk factors are tumor lysis syndrome, sepsis, and malnourishment at the time of presentation.
    Abstract
    Keywords: Mature B cell non-Hodgkin lymphoma, Acute mortality, S
