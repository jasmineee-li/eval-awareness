    \ Attribution License (http://creativecommons.org/licenses/by/2.0), which permits\
    \ unrestricted use, distribution, and reproduction in any medium, provided the\
    \ original work is properly cited.Nanofluids (suspensions of nanometer-sized particles\
    \ in base fluids) have recently been shown to have nucleate boiling critical heat\
    \ flux (CHF) far superior to that of the pure base fluid. Over the past decade,\
    \ numerous experimental and analytical studies on the nucleate boiling CHF of\
    \ nanofluids have been conducted. The purpose of this article is to provide an\
    \ exhaustive review of these studies. The characteristics of CHF enhancement in\
    \ nanofluids are systemically presented according to the effects of the primary\
    \ boiling parameters. Research efforts to identify the effects of nanoparticles\
    \ underlying irregular enhancement phenomena of CHF in nanofluids are then presented.\
    \ Also, attempts to explain the physical mechanism based on available CHF theories\
    \ are described. Finally, future research needs are identified. ==== Body Introduct"
