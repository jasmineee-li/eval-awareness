    Title of Invention: Compliant contact integrator
    Abstract: A contact integrator for supporting a die in a semiconductor package and for providing an electrical pathway from the semiconductor package to one or more bonding pads on the die is provided. The contact integrator includes a substrate that has one or more conductor trace for interconnection to the semiconductor package. A Z-elastomer member is disposed on the substrate. An insulating member is disposed on the Z-elastomer member. One or more conductor rods are coupled to the insulating member. Each of the conductor rods has a first end adapted to contact one of the bonding pads and a second end adapted to contact the Z-elastomer member. The conductor rods are respectively substantially vertically aligned with the bonding pads and the conductor traces, and are capable of longitudinal movement relative to the insulating member.
