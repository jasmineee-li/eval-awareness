- body: "Plechtige vergadering - Palestijnse Autoriteit\nDe Voorzitter\nDames en heren,\
    \ het is mij een grote eer en genoegen om vandaag Mahmoud Abbas, president van\
    \ de Palestijnse Autoriteit, te verwelkomen in het Europees Parlement. Mijnheer\
    \ de president, het Europees Parlement heet u van harte welkom.\n(Applaus)\nOok\
    \ de president van Isra\xEBl, Shimon Peres, was uitgenodigd, maar hij heeft helaas\
    \ af moeten zeggen vanwege de viering van het zestigjarig bestaan van zijn land.\
    \ Wij hopen dat het bezoek van president Peres spoedig zal kunnen plaatsvinden.\n\
    Mijnheer de president, het is niet de eerste keer dat u een bezoek aan het Europees\
    \ Parlement aflegt. Ik heet u hier in Straatsburg welkom in een voor het Midden-Oosten,\
    \ en het in het bijzonder uw volk, het Palestijnse volk, een buitengewoon moeilijke\
    \ periode. Ik herinner me onze laatste ontmoeting in het Midden-Oosten, die bijna\
    \ twee jaar geleden - eind mei 2007 - in Gaza werd gehouden. U ontving me in het\
    \ offici\xEBle hoofdkwartier van de Palestijnse Autoriteit. Ik zal deze ontmoeting\
    \ nooit vergeten; de situatie was uiterst gespannen. Op dat moment leidde u delicate\
    \ besprekingen voor de redding van de regering van nationale eenheid die u op\
    \ energieke wijze en met vooruitziende blik had gevormd. Helaas maakte een roemloze\
    \ staatsgreep na tien dagen een einde aan uw inspanningen.\nVandaag bent u rechtstreeks\
    \ overgekomen uit Ca\xEFro na een tussenstop in Parijs, waar u een ontmoeting\
    \ had met de Franse president. De afgelopen dagen vonden in Ca\xEFro veelbelovende\
    \ gesprekken plaats over de vorming van een Palestijnse regering van nationale\
    \ eenheid.\nHet lijden van het Palestijnse volk door de tragedie in de Gazastrook\
    \ heeft het Europees Parlement niet onberoerd"
