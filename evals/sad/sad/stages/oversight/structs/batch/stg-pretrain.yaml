- body: |-
    Issue title: Cannot monitor file/directory changes in Java code - missing 'inotify_add_watch' (and maybe others)
     Issue body: I am using _Java_ code similar to the _Groovy_ script below in order to monitor file/directory changes (similar to _tail -f_). The code works fine on Windows and Linux and it **used to work** on OSV, but no longer. When I run it now I get:

    ```
    java.io.IOException: No file descriptors available
        at sun.nio.fs.LinuxWatchService.<init>(LinuxWatchService.java:61)
        at sun.nio.fs.LinuxFileSystem.newWatchService(LinuxFileSystem.java:47)
    ```

    The _Groovy_ test script (which can easily be turned into a _Java_ one...):

    ``` groovy
    #!/usr/bin/env groovy

    import java.nio.file.FileSystem
    import java.nio.file.FileSystems
    import java.nio.file.Path
    import java.nio.file.StandardWatchEventKinds
    import java.nio.file.WatchEvent
    import java.nio.file.WatchKey
    import java.nio.file.WatchService
    import java.nio.file.WatchEvent.Kind
