    \ be done?\n    \n    Thanks!\n\nThen @revolt_randy (revolt_randy) said\n\n  \
    \  I guess it's just a matter of personal preference really, and personally, I\
    \ prefer to use armatures every time I can. The main reason why I prefer armatures\
    \ is animation work flow, it makes life easier. Working with the animation editors\
    \ in blender is object based.\n    \n    When you create an animation, blender\
    \ creates an action for the object. Key the loc/rot of the camera on a frame,\
    \ key the loc/rot of the camera on a different frame. Simple enough, and you have\
    \ created an action for the camera. Say you want to try out a different camera\
    \ angle, to see how it looks. Simple enough, create a new action for the camera\
    \ and insert keys as needed. Easy enough. You can see your keys in the dopesheet\
    \ editor, but to switch actions on the camera from one action to the other, you'd\
    \ have to switch from the dopesheet editor t"
