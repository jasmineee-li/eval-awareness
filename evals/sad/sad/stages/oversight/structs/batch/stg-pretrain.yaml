- body: "Title of Invention: Acoustic panel\nAbstract: \nThe disclosure is directed\
    \ to an acoustic panel. The acoustic panel comprises a body coupled to a first\
    \ member and a second member and between a first end cap and a second end cap.\
    \ The body is configured to reflect sound. The acoustic panel further comprises\
    \ an aperture disposed in the first member and the second member, and a bracket\
    \ coupled to the aperture. The aperture and the bracket are configured to receive\
    \ and retain a pole coupled to a batten of a line set. The acoustic panel is rotatably\
    \ coupled to the pole.\n\nDetailed Description: \n\nBACKGROUND\nThe present disclosure\
    \ relates to acoustic panels, specifically lightweight acoustic panels designed\
    \ to reflect and redirect sound.\nIn theatrical, stage or orchestral performances,\
    \ acoustic panels are utilized to reflect the sound emanating from the orchestra\
    \ (or band) towards the audience. Generally, these acoustic panels are assembled\
    \ vertically by placing several panels adjacent each other to form a screen or\
    \ a shell. In many cases, these panels are assembled into a portable acoustic\
    \ panel structure that can be moved along the ground for positioning around the\
    \ orchestra as in U.S. Pat. No. 5,069,011 to Jenne. However, these portable acoustic\
    \ panel structures are difficult to maneuver, have a specific angle for reflecting\
    \ sound, and cannot be utilized as a canopy.\nA"
