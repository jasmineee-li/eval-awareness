- body: "Eminescu's Linden Tree\n\nEminescu's Linden Tree (Teiul lui Eminescu) is\
    \ a 500-year-old silver lime (Tilia tomentosa Moench) in Copou Park, Ia\u0219\
    i, Romania.\n\nMihai Eminescu reportedly wrote some of his best works underneath\
    \ this lime, rendering the tree one of Romania's most important natural monuments\
    \ and a Ia\u0219i landmark.\n\nAge\n\nAccording to the Iasi Environmental Protection\
    \ Agency's official data, the tree is approximately 458 years old. A more recent\
    \ survey conducted using an increment borer, placed the tree at 540 years of age\
    \ (+- 3%).\n\nCivic symbol\n\nThe tree was used as a civic symbol by the students\
    \ who protested, in February 2013, against the removal (by felling) of the linden\
    \ tree alignment in the Ia\u015Fi city centre, and its replacement by the local\
    \ municipality with miniature Japanese shrubs. In November 2015, the decision\
    \ was reversed following a public referendum on the topic, which resulted in the\
    \ reinstatement of limes in the city centre.\n\nCurrent status\n\nIn June 2014,\
    \ Asociatia Dendro-Ornamentala \"Anastasie Fatu Iasi\", backed by the Ia\u015F\
    i Academic Group and the 'Ia\u0219ul Iube\u0219te Teii' ('Iasi Loves Its Linden\
    \ Trees') civic campaign, with support from 'Asocia\u021Bia Peisagi\u0219tilor\
    \ din Rom\xE2nia' (ASOP) and 'Centrul de resurse pentru participare publica' (The\
    \ Resource Center for Public Participation) (CeRe) (Bucharest), warned the City\
    \ Hall over the tree's near critical condition, and asked for a number of emergency\
    \ dendrological meas"
