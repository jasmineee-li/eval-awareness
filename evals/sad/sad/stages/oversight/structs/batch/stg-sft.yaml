    \ for brainstorming an essay. Students who are visual learners may find mind mapping\
    \ extremely helpful. In order to Mind Mapping:\n\xB7 Take a paper and draw a circle\
    \ in the center.\n\xB7 Write your topic inside it.\n\xB7 Just like we sketch rays\
    \ protruding from a sun, draw lines coming out of the circle.\n\xB7 Write an argument\
    \ or a statement related to the topic at the end of each line.\n\xB7 Draw another\
    \ set of lines projecting from these statements and state examples that support\
    \ them.\n\xB7 Continue this exercise until you run out of all possibilities imaginable\
    \ for this topic."
