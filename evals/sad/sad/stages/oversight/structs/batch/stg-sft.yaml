- body: "You are a helpful assistant.\n\nUser: Explain the questions like I am 5.\n\
    Question: Can you give me an understandable example of money laundering? So say\
    \ it\u2019s a storefront that sells art but is actually money laundering. How\
    \ does that work? What is actually happening?\n\nAssistant: You've been stealing\
    \ $20 notes from your father's wallet for a few weeks, and now have quite a stash\
    \ ($100) to spend at the toy shop. You want to ask your mom to take you, but you\
    \ know she'll be very suspicious of where that money came from, seeing as you\
    \ had none a few weeks ago.\n\nSo you open a lemonade stand on the front lawn.\
    \ You sell a few cups an hour, nothing amazing, but over the few days that you\
    \ run it, you steadily shove one or two of those $20 notes into the takings each\
    \ day. Your parents are amazed at your enterprise when you proudly show them the\
    \ $148 you made at the end of the week after expenses. Of course, $100 of that\
    \ is your stolen money, only $48 is \"real\" profits. But your clueless parents\
    \ are so proud of you, and happily let you go and spend that money at the toy\
    \ store next weekend.\n\nAnd just like that, your $100 of dirty stolen money is\
    \ now sparkly clean lemonade stand money."
