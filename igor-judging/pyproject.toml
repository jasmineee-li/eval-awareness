[project]
name = "igor-judging"
version = "0.1.0"
description = "Inspect AI tasks for eval awareness judging"
readme = "README.md"
requires-python = ">=3.11"

# This package is being consolidated into eval-awareness-testbed.
# For new code, use: from eval_awareness_testbed.judges import ...
dependencies = [
    "eval-awareness-testbed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspect_tasks"]

[tool.uv.sources]
eval-awareness-testbed = { workspace = true }
