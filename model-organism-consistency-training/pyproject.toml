[project]
name = "consistency-training"
version = "0.1.0"
description = "Consistency training pipeline for model organisms"
requires-python = ">=3.11"

# NOTE: This package is being consolidated into eval-awareness-testbed.
# For new code, use: from eval_awareness_testbed.model_organisms.training import ...

dependencies = [
    "eval-awareness-testbed",
    # Core deps for standalone scripts
    "pydantic>=2.0",
    "tqdm",
    "aiofiles",
    "pyyaml",
    "simple-parsing",
]

[project.optional-dependencies]
training = [
    "eval-awareness-testbed[training]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consistency_training"]

[tool.uv.sources]
eval-awareness-testbed = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
