[project]
name = "consistency-training"
version = "0.1.0"
description = "Consistency training pipeline for QwQ-32B to produce identical responses regardless of evaluation context"
requires-python = ">=3.10"
dependencies = [
    # Core
    "pydantic>=2.0",
    "tqdm",
    "aiofiles",
    
    # Config
    "pyyaml",
    "simple-parsing",
]

# NOTE: This package also requires safety-tooling, which should be installed separately:
#   uv pip install -e ../safety-tooling
# 
# For RunPod training, install the 'training' extras:
#   uv pip install -e ".[training]"

[project.optional-dependencies]
training = [
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "datasets",
    "accelerate",
    "bitsandbytes",
]
dev = [
    "pytest",
    "ruff",
    "black",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
