# Needham eval config: eval_mcq only, all 5 models, thinking disabled
# Usage: bash eval-awareness-testbed/scripts/run_needham.sh naturalistic-training/configs/qwen3_eval_mcq_only.yaml

vllm:
  port: 8000
  max_model_len: 32768
  startup_wait: 1800
  extra_args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes", "--override-generation-config", "{\"enable_thinking\": false}"]

models:
  # 1. Baseline: Qwen3-32B (no adapter)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 2
    limit: 1000
    epochs: 1
    stages: [eval_mcq]

  # 2. Anti-deception SFT
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 2
    limit: 1000
    epochs: 1
    stages: [eval_mcq]
    lora_adapter: "qwen3_antideception_sft"
    lora_modules: "qwen3_antideception_sft=jasminexli/qwen3-antideception-sft"

  # 3. Anti-sycophancy SFT
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 2
    limit: 1000
    epochs: 1
    stages: [eval_mcq]
    lora_adapter: "qwen3_sycophancy_sft"
    lora_modules: "qwen3_sycophancy_sft=jasminexli/qwen3-sycophancy-sft"

  # 4. Math SFT
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 2
    limit: 1000
    epochs: 1
    stages: [eval_mcq]
    lora_adapter: "qwen3_math_sft"
    lora_modules: "qwen3_math_sft=jasminexli/qwen3-math-sft"

  # 5. UltraFeedback SFT (rerun with thinking disabled)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 2
    limit: 1000
    epochs: 1
    stages: [eval_mcq]
    lora_adapter: "qwen3_ultrafeedback_sft"
    lora_modules: "qwen3_ultrafeedback_sft=jasminexli/qwen3-ultrafeedback-sft"

analysis:
  plots: [score_table]
