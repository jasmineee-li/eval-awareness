# Needham eval config: Qwen3-32B — All 4 finished SFT adapters + baseline
# Usage: bash eval-awareness-testbed/scripts/run_needham.sh naturalistic-training/configs/qwen3_finished_4.yaml

slurm:
  job_name: eval_qwen3_finished_4
  gpus: 4
  time: "12:00:00"
  mem: "128G"
  partition: cais

vllm:
  port: 8000
  max_model_len: 32768
  startup_wait: 1800
  extra_args: "--enable-auto-tool-choice"

models:
  # 1. Baseline: Qwen3-32B (no adapter)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 4
    limit: 1000
    epochs: 1
    stages: [eval_mcq, purpose_mcq, purpose_open, eval_mcq_cot, purpose_open_cot]

  # 2. Anti-deception SFT (Anthropic honesty-elicitation)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 4
    limit: 1000
    epochs: 1
    stages: [eval_mcq, purpose_mcq, purpose_open, eval_mcq_cot, purpose_open_cot]
    lora_adapter: "qwen3_antideception_sft"
    lora_modules: "qwen3_antideception_sft=jasminexli/qwen3-antideception-sft"

  # 3. Anti-sycophancy SFT (google/sycophancy-intervention)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 4
    limit: 1000
    epochs: 1
    stages: [eval_mcq, purpose_mcq, purpose_open, eval_mcq_cot, purpose_open_cot]
    lora_adapter: "qwen3_sycophancy_sft"
    lora_modules: "qwen3_sycophancy_sft=jasminexli/qwen3-sycophancy-sft"

  # 4. Math SFT (GSM8K negative control)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 4
    limit: 1000
    epochs: 1
    stages: [eval_mcq, purpose_mcq, purpose_open, eval_mcq_cot, purpose_open_cot]
    lora_adapter: "qwen3_math_sft"
    lora_modules: "qwen3_math_sft=jasminexli/qwen3-math-sft"

  # 5. UltraFeedback SFT (instruction following, 7.5K dosage-matched)
  - hf_id: "Qwen/Qwen3-32B"
    tp_size: 4
    limit: 1000
    epochs: 1
    stages: [eval_mcq, purpose_mcq, purpose_open, eval_mcq_cot, purpose_open_cot]
    lora_adapter: "qwen3_ultrafeedback_sft"
    lora_modules: "qwen3_ultrafeedback_sft=jasminexli/qwen3-ultrafeedback-sft"

judges:
  methods: "binary_third_person,probability_third_person"
  classifier_model: "openrouter/anthropic/claude-sonnet-4"

analysis:
  plots: [score_table, roc]
