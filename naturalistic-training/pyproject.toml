[project]
name = "naturalistic-training"
version = "0.1.0"
description = "Phase 1: Naturalistic training interventions for eval awareness"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "trl>=0.8.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
    "wandb>=0.24.2",
    "huggingface_hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
