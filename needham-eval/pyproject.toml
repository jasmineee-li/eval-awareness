[project]
name = "needham-eval"
version = "0.1.0"
description = "Reproduction of 'Large Language Models Often Know When They Are Being Evaluated' paper"
readme = "README.md"
requires-python = ">=3.11"

# This package is being consolidated into eval-awareness-testbed.
# For new code, use: from eval_awareness_testbed.judges.needham import ...
dependencies = [
    "eval-awareness-testbed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "cot_classifiers"]

[tool.uv.sources]
eval-awareness-testbed = { workspace = true }
