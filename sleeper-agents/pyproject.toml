[project]
name = "sleeper-agents"
version = "0.1.0"
description = "Sleeper agents: training deceptive LLMs that persist through safety training"
authors = [
    { name = "lauritowal" },
    { name = "cmathw" },
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core ML
    "torch>=2.2.1",
    "torchvision>=0.17.1",
    "torchaudio>=2.2.1",
    "transformers>=4.47.0",
    "accelerate>=1.0.0",
    "datasets>=2.17.1",
    "bitsandbytes>=0.42.0; sys_platform == 'linux'",
    "trl>=0.8.0",
    "peft>=0.8.2",
    # Tokenizers & serialization
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.3",
    # Inference (Ollama — used by original data gen script)
    "ollama>=0.2.0",
    # Experiment tracking
    "wandb>=0.17.4",
    # Data & config
    "pyyaml>=6.0.1",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    # Visualization
    "matplotlib>=3.9.1",
    "seaborn>=0.13.2",
    # Notebooks
    "ipykernel>=6.29.3",
    "ipywidgets>=8.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.2",
    "ruff>=0.4",
]
# vLLM for fast batch inference during data generation (Linux + CUDA only)
vllm = [
    "vllm>=0.6.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sleeper_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
